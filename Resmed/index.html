<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ResMed Equity Research</title>
<meta name="description" content="Equity research e avaliação da ResMed Inc. (NYSE: RMD) por Rogério Teles. Estudo pessoal, não é recomendação de investimento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: faixa azul-marinho com o percurso cotação → valor, separadores fixos, conteúdo em grelha de 12 colunas */
:root{
  --bg:#FFFFFF; --surface:#F3F6FC; --surface2:#E6EDF9; --line:#DCE2EE; --line2:#C3CCDD;
  --text:#0D0A15; --text2:#3D3B44; --text3:#6E6C73;
  --navy:#102661; --navy2:#1B3378; --on-navy:#FFFFFF; --on-navy2:#B5C3EA;
  --blue:#006DFF; --blue-d:#004BA6; --blue-l:#97C7FF; --blue-xl:#D0E8FF;
  --purple:#7957FF; --purple-l:#B9B9FF; --magenta:#BC299B; --red:#E6004A;
  --pos:#0A7F53; --neg:#D1003F; --warn:#B86E00;
  --font:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --heat-pos:0,109,255; --heat-neg:230,0,74;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C18; --surface:#121630; --surface2:#1A2042; --line:#262D52; --line2:#3A4370;
    --text:#F1F3FA; --text2:#C2C8DE; --text3:#8D94B2;
    --navy:#0B1846; --navy2:#16276A;
    --blue:#3D8BFF; --blue-d:#97C7FF; --blue-l:#2C5AA8; --blue-xl:#17295A;
    --purple:#9A82FF; --purple-l:#4B3F99; --magenta:#E35BC4; --red:#FF4D7D;
    --pos:#3FCF8E; --neg:#FF5C80; --warn:#F2A93B;
    --heat-pos:61,139,255; --heat-neg:255,77,125;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C18; --surface:#121630; --surface2:#1A2042; --line:#262D52; --line2:#3A4370;
  --text:#F1F3FA; --text2:#C2C8DE; --text3:#8D94B2;
  --navy:#0B1846; --navy2:#16276A;
  --blue:#3D8BFF; --blue-d:#97C7FF; --blue-l:#2C5AA8; --blue-xl:#17295A;
  --purple:#9A82FF; --purple-l:#4B3F99; --magenta:#E35BC4; --red:#FF4D7D;
  --pos:#3FCF8E; --neg:#FF5C80; --warn:#F2A93B;
  --heat-pos:61,139,255; --heat-neg:255,77,125;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px}
.num,td,th{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* Cabeçalho */
.top{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(0,109,255,.55),rgba(121,87,255,.25) 45%,transparent 70%);pointer-events:none}
.brandrow{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:32px;align-items:center;padding-top:24px;padding-bottom:18px}
.ticker{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--on-navy2);margin:0 0 4px;text-transform:uppercase}
.brand-name{font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:2px 0 0}
.logo{display:block;height:38px;width:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-sub{font-size:14px;color:var(--on-navy2);margin:6px 0 0}
.trip{display:flex;align-items:center;gap:14px}
.stop small{display:block;font-size:12px;color:var(--on-navy2);line-height:1.2}
.stop b{display:block;font-size:21px;font-weight:800;line-height:1.25}
.route{width:84px;height:2px;background:linear-gradient(90deg,var(--on-navy2),#fff);position:relative;transform-origin:left;animation:route .9s cubic-bezier(.3,.7,.2,1) .15s both}
.route::after{content:"";position:absolute;right:-1px;top:-4px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.chip-up{display:inline-block;font-size:13px;font-weight:800;background:#fff;color:#102661;border-radius:99px;padding:3px 10px;margin-left:6px;vertical-align:middle}
@keyframes route{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.route{animation:none}}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:var(--on-navy2);font-size:13px;font-weight:800;padding:6px 14px;border-radius:99px}
.lang button[aria-pressed="true"]{background:#fff;color:#102661}

.tabsbar{background:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid rgba(255,255,255,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px;padding-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#C9D3F0;font-size:14.5px;font-weight:600;padding:8px 15px;border-radius:99px;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:#006DFF}

.notice{background:var(--surface);color:var(--text2);font-size:13px;border-bottom:1px solid var(--line)}
.notice .wrap{padding-top:9px;padding-bottom:9px}
.notice b{color:var(--text)}

/* Conteúdo */
main{padding-top:40px;padding-bottom:64px;min-height:60vh}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
h1{font-size:clamp(27px,4vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0 0 16px;max-width:24em;text-wrap:balance}
.lead{font-size:18px;line-height:1.55;color:var(--text2);max-width:70ch;margin:0}
.lead+.lead{margin-top:10px}
h2{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0 0 8px;line-height:1.35}
p{margin:0 0 12px}
.sec{margin-top:52px;padding-top:24px;border-top:1px solid var(--line)}
.sub{color:var(--text2);max-width:76ch;margin:0 0 22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;align-items:start}
.g2w{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.g2>*,.g2w>*,.g3>*,.g4>*{min-width:0}
.mt{margin-top:28px}
.note{font-size:12.5px;color:var(--text3);margin:10px 0 0;max-width:92ch}
.cap{font-size:14px;font-weight:700;margin:0 0 2px}
.capsub{font-size:12.5px;color:var(--text3);margin:0 0 10px}

/* Números-chave */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:28px}
.kpi{background:var(--bg);padding:16px 18px}
.kpi small{display:block;font-size:12.5px;color:var(--text3);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--text2)}

/* Cartões */
.card{background:var(--surface);border-radius:14px;padding:20px}
.card.line{background:var(--bg);border:1px solid var(--line)}
.prod{display:flex;flex-direction:column;gap:6px}
.prod .tag{align-self:flex-start;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;color:#fff}
.prod .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.prod ul{margin:4px 0 0;padding-left:18px;color:var(--text2);font-size:14px}
.list{margin:0;padding-left:18px}
.deal{display:flex;flex-direction:column;gap:4px}.deal h3{font-size:19px;margin:6px 0 2px}.deal .tag{align-self:flex-start;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;color:#fff}
.deal p{margin:0 0 8px;color:var(--text2);font-size:14.5px}.deal .dl{margin:6px 0 2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blue)}
.list li{margin:0 0 7px}
.chart{position:relative;height:300px}
.chart.tall{height:360px}
.chart.short{height:240px}

/* Tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:700;color:var(--text3);background:var(--surface);text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
.fsw th:first-child,.fsw td:first-child{min-width:240px}
@media (max-width:560px){th:first-child,td:first-child{min-width:120px}.fsw th:first-child,.fsw td:first-child{min-width:170px}}
tbody tr:last-child td{border-bottom:0}
tr.h td{font-weight:800;color:var(--blue);background:var(--surface);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr.s td{font-weight:700}
tr.t td{font-weight:800;background:var(--surface2)}
td.proj,th.proj{background:color-mix(in srgb,var(--purple) 7%,transparent)}
th.proj{color:var(--purple)}
.tbl-text td{white-space:normal;text-align:left}
.tbl-text td{min-width:90px}.tbl-text td:last-child{min-width:240px}

/* Sub-navegação */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 0 16px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:13.5px;font-weight:700;padding:7px 15px;border-radius:99px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* SWOT */
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sw{border-radius:14px;padding:20px;border:1px solid var(--line)}
.sw h3{display:flex;align-items:center;gap:8px}
.sw h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.sw ul{margin:0;padding-left:18px;color:var(--text2);font-size:14.5px}
.sw li{margin-bottom:6px}

/* Matriz de risco */
.matrix{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:6px;font-size:13px}
.matrix .ax{display:flex;align-items:center;justify-content:center;color:var(--text3);font-weight:700;text-align:center}
.cell{border-radius:10px;min-height:92px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 7px;border-radius:99px;font-weight:800;font-size:12.5px;background:var(--bg);border:1.5px solid var(--c);color:var(--text)}
.rk.ma{border-style:dashed}
.lvl{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 9px}
.l1{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.l2{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.l3{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}

/* Heatmap */
.heat td{text-align:center;font-weight:600}
.concl-box{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:26px 30px;background:var(--surface)}
.concl-box h2{margin-bottom:14px}
.concl-box p{font-size:16px;line-height:1.65;color:var(--text);max-width:82ch;margin:0 0 12px}
.concl-box .sig{font-weight:700;color:var(--text2);margin:16px 0 0}
.quote{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.qname{font-weight:700;color:var(--text2)} .qprice{font-size:24px;font-weight:800} .qchg{font-weight:700}
.qimg{background:#fff;padding:8px} .qimg img{display:block;width:100%;height:auto;max-width:100%}
.qperf{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.qperf>div{background:var(--bg);padding:10px 8px;text-align:center}
.qperf small{display:block;font-size:12px;color:var(--text3);font-weight:600} .qperf b{font-size:14.5px}
@media (max-width:700px){.qperf{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:stretch}
.sliders{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:14px;padding:20px}
.sliders label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;margin-top:6px}
.sliders label b{font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
.sliders input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.reset{align-self:flex-start;margin-top:10px;border:1px solid var(--line2);background:var(--bg);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700}
.reset:hover{border-color:var(--blue);color:var(--blue)}
.simout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.simout>div{background:var(--bg);padding:14px 16px}
.simout small{display:block;font-size:12.5px;color:var(--text3);font-weight:600}
.simout b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.simout .big{grid-column:1/-1;background:var(--navy);color:#fff}
.simout .big small{color:var(--on-navy2)} .simout .big b{font-size:32px;color:#fff} .simout .big span{font-weight:700;font-size:13.5px}
.simout .big .pos{color:#7FE3B4} .simout .big .neg{color:#FF9DB5}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.vel td{text-align:right}.vel td:first-child{text-align:left;min-width:150px}
.ind td:last-child,.ind th:last-child{background:var(--surface);font-weight:700}
.heat td.base{outline:2.5px solid var(--text);outline-offset:-3px;font-weight:800}
.heat th:first-child,.heat td:first-child{min-width:110px;text-align:left}

/* Ponte de valor */
.bridge{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bridge div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.bridge div:last-child{border-bottom:0}
.bridge .tot{background:var(--surface2);font-weight:800}
.bridge .fin{background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.bridge span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Veredicto */
.verdict{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;border-radius:18px;overflow:hidden;background:var(--navy);color:#fff}
.verdict .l{padding:28px}
.verdict .r{padding:28px;background:var(--navy2);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:center}
.verdict small{display:block;color:var(--on-navy2);font-size:12.5px;font-weight:600}
.verdict b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.verdict h2{color:#fff}
.verdict p{color:#DCE4FA}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.method{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.method small{color:var(--text3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.method b{display:block;font-size:24px;font-weight:800;margin:2px 0}
.method.out{opacity:.7;border-style:dashed}

/* Rodapé */
footer{background:var(--surface);border-top:1px solid var(--line);font-size:13px;color:var(--text2)}
footer .wrap{padding-top:32px;padding-bottom:40px}
footer h3{font-size:14px}
footer .srcs{margin:0 0 18px}.srcs p{margin:0 0 5px}

.disc{border:1.5px solid var(--red);border-radius:12px;padding:14px 16px;background:var(--bg);color:var(--text);margin-bottom:22px}
.disc b{color:var(--red)}

@media (max-width:900px){
  .brandrow{grid-template-columns:1fr auto;gap:16px}
  .trip{grid-column:1/-1;order:3}
  .g2,.g2w,.g3,.verdict{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding-left:16px;padding-right:16px}
  .brand-name{font-size:25px}
  .logo{height:30px}
  .swot{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr}
  .verdict .r{grid-template-columns:1fr 1fr}
  .matrix{grid-template-columns:54px repeat(3,minmax(0,1fr))}
  .route{width:40px}
  .stop b{font-size:18px}
}
</style>

<header class="top">
  <div class="wrap brandrow">

function dcfCalc(W,g){
  const df=[1,2,3,4,5].map(n=>Math.pow(1+W,-n));
  const tv=MODEL.nopatT*(1+g)*(1-g/MODEL.roicT)/(W-g);
  const pv=MODEL.fcf.reduce((a,f,i)=>a+f*df[i],0), pvtv=tv*df[4], ev=pv+pvtv;
  return {ev, tvw:pvtv/ev, ps:(ev+MODEL.cash)/MODEL.sh*(1+W)-MODEL.dps};
}
function evaCalc(W,g){
  const df=[1,2,3,4,5].map(n=>Math.pow(1+W,-n));
  const eva=MODEL.nopat.map((n,i)=>n-W*MODEL.ic[i]);
  const nT=MODEL.nopatT*(1+g), roic=nT/MODEL.icT, tv=MODEL.icT*(roic-W)/(W-g);
  const mva=eva.reduce((a,e,i)=>a+e*df[i],0)+tv*df[4], ev=MODEL.ic0+mva;
  return {ev, mva, roic, ps:(ev+MODEL.cash)/MODEL.sh*(1+W)-MODEL.dps};
}

function simUpdate(k){

    : `<div class="big"><small>${t('O WACC tem de ser superior a g','WACC must be above g')}</small><b>–</b></div>`;
  const ws=[-1,-0.5,0,0.5,1].map(x=>S.w+x), gs=[-1,-0.5,0,0.5,1].map(x=>S.g+x);
  let h=`<div class="tw"><table class="heat"><thead><tr><th>WACC \\ g</th>${gs.map(x=>`<th>${D(nf(x,2))}%</th>`).join('')}</tr></thead><tbody>`;
  ws.forEach((w,i)=>{
    h+=`<tr><td><b>${D(nf(w,2))}%</b></td>`+gs.map((gg,j)=>{
      if(w-gg<=0.5||gg<0) return '<td>–</td>';
      const v=f(wOf(w),gg/100).ps, dd=v/V.price-1, a=Math.min(Math.abs(dd)/0.45,1)*.55+.06, rgb=dd>=0?css('--heat-pos'):css('--heat-neg');

    }).join('')+'</tr>';
  });
  el(k+'-grid').innerHTML=h+'</tbody></table></div>';
}

function nf(v,d=0){
  if(v===null||v===undefined||isNaN(v)) return '–';
  const s = Math.abs(v).toFixed(d); let [i,f] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, L==='pt' ? '.' : ',');
  return (v<0?'−':'') + i + (f ? (L==='pt'?',':'.')+f : '');
}
const pc = (v,d=1) => (v===null||v===undefined) ? '–' : nf(v*100,d)+'%';
const usd = (v,d=2) => 'US$ '+nf(v,d);
const up = v => { const r=Math.round(v*1000)/1000; return (r>=0?'+':'') + pc(r===0?0:r,1); };
const lbl = s => s.includes('|') ? (L==='pt' ? s.split('|')[0] : s.split('|')[1]) : s;

function mk(id,cfg){ const el=document.getElementById(id); if(!el||!window.Chart) return; charts.push(new Chart(el,cfg)); }

function table(head, rows, opts={}){
  const ncol = head.length;
  let h = '<div class="tw"><table'+(opts.cls?` class="${opts.cls}"`:'')+'><thead><tr>'+head.map((x,i)=>`<th${opts.proj&&i>opts.proj?' class="proj"':''}>${x}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.k==='h'){ h += `<tr class="h"><td colspan="${ncol}">${r.l}</td></tr>`; return; }
    h += `<tr${r.k&&r.k.length===1?` class="${r.k}"`:''}><td>${r.l}</td>`+r.c.map((c,i)=>`<td${opts.proj&&i>=opts.proj?' class="proj"':''}>${c}</td>`).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function fmtCell(v,k){
  if(v===null||v===undefined) return '–';
  if(k==='p') return pc(v,1);
  if(k==='x') return nf(v,2)+'x';
  if(k==='x1') return nf(v,1)+'x';
  if(k==='d') return nf(v,0);
  if(k==='m') return nf(v,1);
  if(k==='x2') return v<0 ? '('+nf(-v,2)+')' : nf(v,2);
  if(k==='n0') return nf(v,0);
  if(k==='cf') return v<0 ? '($'+nf(-v,0)+')' : '$'+nf(v,0);
  if(k==='u2') return v<0 ? '($'+nf(-v,2)+')' : '$'+nf(v,2);
  if(k==='xx') return nf(v,2)+'x';
  if(k==='m2') return nf(v,2);
  if(k==='u'||k==='eps') return nf(v,2);
  if(k==='f') return nf(v,4);
  return nf(v,1);
}

function mixTables(){
  const tot = Y.map((_,i)=>LINES.dev[i]+LINES.mask[i]+LINES.soft[i]);
  const gr = a => a.map((v,i)=> i===0 ? '–' : up(v/a[i-1]-1));
  const sh = a => a.map((v,i)=> pc(v/tot[i]));
  const sbh = SEGS.sbh, rcs = SEGS.rcs;
  const rows = [
    {k:'h',l:t('Peso por linha de negócio','Share by business line')},
    {l:t('Aparelhos','Devices'),c:sh(LINES.dev)},
    {l:t('Máscaras e outros','Masks and other'),c:sh(LINES.mask)},

    {l:'Sleep and Breathing Health',c:sbh.map(v=>nf(v,1))},
    {l:'Residential Care Software',c:rcs.map(v=>nf(v,1))},
    {k:'t',l:t('Total','Total'),c:tot.map(v=>nf(v,1))},
    {k:'h',l:t('Crescimento anual','Annual growth')},

function velTable(){
  const yrs=['2022','2023','2024','2025','2026'];

  VEL.forEach(r=>{
    const v=r[3], g=v.slice(1).map((x,i)=>x/v[i]-1), cagr=Math.pow(v[5]/v[0],1/5)-1;
    const cell=d=>{const a=Math.min(Math.abs(d)/0.35,1)*.5+.05; const rgb=d>=0?css('--heat-pos'):css('--heat-neg'); return `<td style="background:rgba(${rgb},${a.toFixed(2)})">${up(d)}</td>`;};
    const pp = r[2]==='m' ? (v[5]-v[0])*100 : null;
    h+=`<tr><td><b>${t(r[0],r[1])}</b></td>${g.map(cell).join('')}<td style="font-weight:800">${up(cagr)}</td><td>${pp===null?'–':(pp>=0?'+':'')+nf(pp,1)+' p.p.'}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}

function heat(s, base){
  const lo = Math.min(...s.v.flat()), hi = Math.max(...s.v.flat());
  let h = `<div class="tw"><table class="heat"><thead><tr><th>WACC \\ g</th>${s.g.map(g=>`<th>${pc(g,1)}</th>`).join('')}</tr></thead><tbody>`;
  s.v.forEach((row,i)=>{
    h += `<tr><td><b>${pc(s.w[i],1)}</b></td>`+row.map((v,j)=>{
      const d = v/V.price-1; const a = Math.min(Math.abs(d)/0.45,1)*.55+.06;
      const rgb = d>=0 ? css('--heat-pos') : css('--heat-neg');
      return `<td class="${i===2&&j===2?'base':''}" style="background:rgba(${rgb},${a.toFixed(2)})" title="${up(d)}">${nf(v,2)}</td>`;
    }).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ============ MOTOR ============ */
const VIEWS = {geral:[vGeral,cGeral],gov:[vGov,cGov],perf:[vPerf,cPerf],swot:[vSwot,null],fs:[vFs,null],dcf:[vDcf,cDcf],eva:[vEva,cEva],mult:[vMult,cMult],concl:[vConcl,cConcl]};
function render(keepScroll){
  charts.forEach(c=>c.destroy()); charts=[];
  if(window.Chart){ Chart.defaults.animation.duration = 450; Chart.defaults.font.family = css('--font'); Chart.defaults.color = css('--text2'); }
  chrome();
  const [v,c] = VIEWS[TAB];
  document.getElementById('view').innerHTML = v();
  document.getElementById('view').setAttribute('aria-labelledby','tab-'+TAB);
  if(c) c();
  const act = document.getElementById('tab-'+TAB); if(act && act.scrollIntoView) act.scrollIntoView({block:'nearest',inline:'nearest'});
  if(!keepScroll) window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
  const tb = e.target.closest('[data-tab]'); if(tb){ TAB = tb.dataset.tab; try{history.replaceState(null,'','#'+TAB)}catch(_){} render(); return; }
  const lg = e.target.closest('[data-lang]'); if(lg){ L = lg.dataset.lang; try{localStorage.setItem('rmd-lang',L)}catch(_){} render(true); return; }
  const fs = e.target.closest('[data-fs]'); if(fs){ FSV = fs.dataset.fs; render(true); }
});
document.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.sim) return;
  SIM[el.dataset.sim][el.dataset.p]=parseFloat(el.value); simUpdate(el.dataset.sim);
});
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-reset]'); if(!r) return; const k=r.dataset.reset;
  SIM[k]={w:7.88,g:2.2}; document.getElementById(k+'-w').value=7.88; document.getElementById(k+'-g').value=2.2; simUpdate(k);
});
document.addEventListener('keydown',e=>{
  if(!e.target.classList || !e.target.classList.contains('tab')) return;
  const i = TABS.findIndex(x=>x[0]===TAB);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ TAB = TABS[(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length][0]; render(true); document.getElementById('tab-'+TAB).focus(); }
});
try{ const h = location.hash.replace('#',''); if(VIEWS[h]) TAB = h; }catch(e){}
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(true)); }catch(e){}
new MutationObserver(()=>render(true)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render(true);
</script>
