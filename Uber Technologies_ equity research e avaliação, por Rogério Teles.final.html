:root{
  --bg:#FFFFFF; --surface:#F6F6F6; --surface2:#EEEEEE; --line:#E2E2E2; --line2:#CBCBCB;
  --text:#000000; --text2:#545454; --text3:#757575;
  --ink:#000000; --on-ink:#FFFFFF; --on-ink2:#AFAFAF; --ink-line:#000000;
  --blue:#276EF1; --green:#06C167; --pos:#05944F; --neg:#E11900; --yellow:#FFC043; --orange:#FF6937; --gray:#AFAFAF;
  --font:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#141414; --surface2:#1F1F1F; --line:#2B2B2B; --line2:#4A4A4A;
    --text:#FFFFFF; --text2:#B4B4B4; --text3:#8C8C8C;
    --ink:#000000; --ink-line:#2B2B2B;
    --blue:#5B91F5; --pos:#06C167; --neg:#F25138; --gray:#6B6B6B;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#141414; --surface2:#1F1F1F; --line:#2B2B2B; --line2:#4A4A4A;
  --text:#FFFFFF; --text2:#B4B4B4; --text3:#8C8C8C;
  --ink:#000000; --ink-line:#2B2B2B;
  --blue:#5B91F5; --pos:#06C167; --neg:#F25138; --gray:#6B6B6B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:28px;padding-right:28px}

/* ---------- Cabeçalho ---------- */
.top{background:var(--ink);color:var(--on-ink)}
.brandrow{display:grid;grid-template-columns:auto 1fr auto;gap:40px;align-items:center;padding-top:26px;padding-bottom:18px}
.ticker{font-size:13px;font-weight:600;color:var(--on-ink2);margin:0 0 2px}
.brand-name{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:0}
.brand-sub{font-size:14px;color:var(--on-ink2);margin:6px 0 0}

/* O percurso: da cotação (ponto de partida) ao valor estimado (destino) */
.trip{display:flex;align-items:center;gap:14px;justify-self:end;min-width:0}
.stop{display:flex;align-items:center;gap:10px;white-space:nowrap}
.stop i{flex:none;width:12px;height:12px;background:var(--on-ink)}
.stop.from i{border-radius:50%}
.stop small{display:block;font-size:12px;color:var(--on-ink2);line-height:1.2}
.stop b{display:block;font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.route{width:110px;height:2px;background:var(--on-ink);transform-origin:left center;animation:route .9s cubic-bezier(.3,.7,.2,1) .15s both}
.up{font-size:13px;font-weight:700;background:var(--green);color:#000;border-radius:99px;padding:3px 9px;margin-left:2px}
@keyframes route{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.route{animation:none}}

.lang{display:flex;background:#1F1F1F;border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:var(--on-ink2);font-size:13px;font-weight:700;padding:6px 13px;border-radius:99px}
.lang button[aria-pressed="true"]{background:#fff;color:#000}

.tabsbar{background:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--ink-line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#CBCBCB;font-size:15px;font-weight:600;padding:8px 15px;border-radius:99px;white-space:nowrap}
.tab:hover{background:#1F1F1F;color:#fff}
.tab[aria-selected="true"]{background:#fff;color:#000}

.notice{background:var(--surface);color:var(--text2);font-size:13px;border-bottom:1px solid var(--line)}
.notice .wrap{padding-top:10px;padding-bottom:10px;line-height:1.45}
.notice b{color:var(--text);font-weight:700}

/* ---------- Conteúdo ---------- */
main{padding-top:44px;padding-bottom:72px;min-height:60vh}
h1{font-size:clamp(28px,4.2vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:0 0 18px;max-width:22em;text-wrap:balance}
.lead{font-size:19px;line-height:1.5;color:var(--text2);max-width:68ch;margin:0}
.lead + .lead{margin-top:10px}
h2{font-size:25px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:0 0 8px}
h3{font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.3}
p{margin:0 0 12px}
.sec{margin-top:56px;padding-top:26px;border-top:2px solid var(--text)}
.sub{color:var(--text2);max-width:72ch;margin:0 0 22px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:start}
.grid2.wide-l{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.mt{margin-top:32px !important}
div.mt:empty{height:0}
.note{font-size:13px;color:var(--text3);margin:12px 0 0;max-width:86ch}
.cap{font-size:14px;font-weight:700;margin:0 0 2px}
.capsub{font-size:13px;color:var(--text3);margin:0 0 10px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* Factos e números-chave */
.facts{display:flex;flex-wrap:wrap;gap:10px 36px;margin:30px 0 0;padding:0;list-style:none}
.facts li{font-size:15px;color:var(--text2)}
.facts b{display:block;font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px}
.kpi{padding:4px 22px 4px 22px;border-left:1px solid var(--line)}
.kpi:first-child{padding-left:0;border-left:0}
.kpi .k-l{font-size:14px;font-weight:700;margin:0}
.kpi .k-v{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 0;font-variant-numeric:tabular-nums}
.kpi .k-u{font-size:13px;color:var(--text3);margin:0}
.kpi .k-d{font-size:14px;font-weight:700;margin:8px 0 0}
.kpi .k-x{font-size:13px;color:var(--text2);margin:4px 0 0}

/* Figura (gráfico de cotações) */
.fig{margin:0}
.fig .fig-im{background:#fff;border:1px solid var(--line);padding:10px;max-width:806px}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--text3);margin-top:10px}
/* Texto corrido (conclusão do autor) */
.prose{max-width:76ch;margin-top:14px}
.grid2.chart-l{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
@media (max-width:860px){.grid2.chart-l{grid-template-columns:minmax(0,1fr)}}
.prose p{margin:0 0 16px;font-size:17px;line-height:1.6}
.prose p:last-child{margin-bottom:0}

/* Tabelas */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{font-size:13px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--text);white-space:nowrap;vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td b,.tbl td strong{font-weight:700}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--text);border-bottom:1px solid var(--text)}
.tbl tr.subt td{font-weight:700}
.tbl tr.subt td.l:not(:first-child){font-weight:400}
.tbl tr.hd td{font-weight:700;font-size:13px;color:var(--text2);padding-top:18px;border-bottom:1px solid var(--line2)}
.tbl tr.hd2 td{font-style:italic;color:var(--text2)}
.tbl tr.hl td{background:var(--surface)}
.tbl tr.hl td:first-child{padding-left:10px}
.tbl tr.hl td:last-child{padding-right:0}
.tbl.fin td:first-child{min-width:290px;max-width:420px}
.tbl.fin tbody td:first-child,.tbl.fin thead th:first-child{position:sticky;left:0;background:var(--bg);z-index:1}
.tbl th.p,.tbl td.p{background:var(--surface)}
.tbl th.p{color:var(--text)}
.tbl.wproj{min-width:1120px}
.tbl.wproj td:first-child{min-width:250px;max-width:300px}
.tbl.wproj th,.tbl.wproj td{padding-left:8px;padding-right:8px}
.tbl.wproj th:last-child,.tbl.wproj td:last-child{padding-right:8px}
.tbl.compact th,.tbl.compact td{padding:7px 10px}
.tbl.compact thead th{white-space:normal}
.tbl.compact th:first-child,.tbl.compact td:first-child{padding-left:0}
.tbl.compact th:last-child,.tbl.compact td:last-child{padding-right:0}
.tbl td:first-child b{white-space:nowrap}
.tbl tr.hl td:first-child{padding-left:10px}
.tbl tr.hl td:last-child{padding-right:0}
.tbl .muted{color:var(--text3)}
.yes{font-weight:700}

/* Gráficos */
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart text{font-family:var(--font);font-size:12px;fill:var(--text2);font-variant-numeric:tabular-nums}
.chart .vl{fill:var(--text);font-weight:700;font-size:12px}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--text);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;padding:0;list-style:none;font-size:13px;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:16px;vertical-align:3px}
.legend i.pj{opacity:.38}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;max-width:260px;display:none;font-variant-numeric:tabular-nums;line-height:1.35}

/* Barras horizontais */
.hb{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.hb li{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:14px;align-items:center;font-size:14px}
.hb .hb-l{line-height:1.3}
.hb .hb-l small{display:block;color:var(--text3);font-size:12.5px}
.hb .hb-t{display:flex;align-items:center;gap:10px;min-width:0}
.hb .hb-b{height:22px;background:var(--text);min-width:2px;flex:none}
.hb .hb-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Cascata (ponte de valor) */
.wf{display:grid;gap:8px;font-size:14px}
.wf-row{display:grid;grid-template-columns:minmax(150px,34%) 1fr 92px;gap:12px;align-items:center}
.wf-l{line-height:1.3}
.wf-t{position:relative;height:26px;background:linear-gradient(var(--line),var(--line)) left center/100% 1px no-repeat}
.wf-b{position:absolute;top:0;bottom:0;min-width:2px}
.wf-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wf-row.total .wf-l{font-weight:700}
.wf-row.total{padding-top:8px;border-top:1px solid var(--text)}

/* Sensibilidade */
.sens{border-collapse:separate;border-spacing:3px;font-size:14px;font-variant-numeric:tabular-nums;width:100%;max-width:640px}
.sens th{font-weight:700;font-size:13px;color:var(--text2);padding:6px 8px;text-align:center;white-space:nowrap}
.sens td{padding:11px 8px;text-align:center;font-weight:600;min-width:64px}
.sens td.base{outline:2px solid var(--text);outline-offset:-2px;font-weight:700}
.sens .ax{font-size:12.5px;color:var(--text3);font-weight:600;text-align:left;padding:0 0 4px 3px}
.sens-key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text2);margin:12px 0 0}
.sens-key i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}

/* Sensibilidade dinâmica */
.sx{max-width:760px}
.sx-ctl{display:grid;grid-template-columns:1fr 1fr;gap:18px 36px;margin:6px 0 22px}
.sx-s{display:block}
.sx-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sx-l{font-size:14px;font-weight:700}
.sx-top output{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sx-s input[type=range]{display:block;width:100%;margin:8px 0 2px;accent-color:var(--text);height:28px;cursor:pointer}
.sx-mm{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.sx-res{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 36px;padding:16px 0;margin-bottom:16px;border-top:1px solid var(--text);border-bottom:1px solid var(--line)}
.sx-res small{display:block;font-size:12.5px;color:var(--text3);margin-bottom:2px}
.sx-res b{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.sx-tag{margin-left:auto;font-size:13px;color:var(--text2);padding-bottom:4px}
.sx-tag button{border:1px solid var(--text);background:transparent;border-radius:99px;font-size:13px;font-weight:700;padding:7px 14px}
.sx-tag button:hover{background:var(--text);color:var(--bg)}
@media (max-width:560px){.sx-ctl{grid-template-columns:1fr}.sx-tag{margin-left:0}.sx-res b{font-size:26px}}

/* Passos (DCF e EVA são uma sequência) */
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 18px;margin-top:44px;padding-top:24px;border-top:2px solid var(--text)}
.step-n{font-size:25px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.eq{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:6px 0 18px}
.eq div{line-height:1.2}
.eq small{display:block;font-size:12.5px;color:var(--text3);margin-bottom:3px}
.eq b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.eq .op{font-size:22px;color:var(--text3);font-weight:600;padding-bottom:2px}
.eq .res b{background:var(--text);color:var(--bg);padding:2px 10px;border-radius:6px}
.bul{margin:0;padding:0 0 0 18px;max-width:74ch}
.bul li{margin-bottom:8px}
.bul li::marker{color:var(--text3)}

/* SWOT e riscos */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--text)}
.swot > div{padding:22px 26px 22px 0;border-bottom:1px solid var(--line)}
.swot > div:nth-child(odd){border-right:1px solid var(--line)}
.swot > div:nth-child(even){padding-left:26px;padding-right:0}
.swot h3{display:flex;align-items:center;gap:10px;font-size:19px}
.swot h3 i{width:12px;height:12px;flex:none}
.swot ul{margin:10px 0 0;padding:0 0 0 18px;font-size:15px}
.swot li{margin-bottom:8px}
.sev{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
.sev i{width:9px;height:9px;background:var(--line2)}
.sev.l1 i:nth-child(-n+1),.sev.l2 i:nth-child(-n+2){background:var(--yellow)}
.sev.l3 i:nth-child(-n+3){background:var(--orange)}
.sev.l4 i:nth-child(-n+4){background:var(--neg)}
.tbl.risk{table-layout:fixed;min-width:780px}
.tbl.risk th:nth-child(1){width:23%}.tbl.risk th:nth-child(3){width:16%}.tbl.risk th:nth-child(4){width:18%}
.tbl.risk td:first-child{font-weight:700}
.tbl.risk td:nth-child(3),.tbl.risk td:nth-child(4){white-space:nowrap}

/* Demonstrações: seletor */
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px;margin:0 0 22px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font-size:14px;font-weight:700;padding:8px 16px;border-radius:99px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* Conclusão: campo de valores */
.ff{position:relative;--lw:190px;--vw:72px;font-size:14px;margin-top:48px}
.ff-row{display:grid;grid-template-columns:var(--lw) 1fr var(--vw);align-items:center;height:54px;border-bottom:1px solid var(--line)}
.ff-row:first-of-type{border-top:1px solid var(--line)}
.ff-l{font-weight:700;line-height:1.2;padding-right:10px}
.ff-l small{display:block;font-weight:400;color:var(--text3);font-size:12.5px}
.ff-t{position:relative;height:100%}
.ff-r{position:absolute;top:19px;height:16px;background:var(--surface2);border:1px solid var(--line2)}
.ff-p{position:absolute;top:15px;width:24px;height:24px;margin-left:-12px;background:var(--text)}
.ff-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ff-over{position:absolute;left:var(--lw);right:var(--vw);top:0;bottom:26px;pointer-events:none}
.ff-line{position:absolute;top:-30px;bottom:0;width:0;border-left:2px solid var(--text)}
.ff-line.avg{border-left:2px dashed var(--pos)}
.ff-line{font-style:normal}
.ff-line b{position:absolute;top:0;left:6px;font-size:12.5px;white-space:nowrap;line-height:1.2}
.ff-line.price b{left:auto;right:8px;text-align:right}
.ff-line.price::before{content:"";position:absolute;top:2px;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--text)}
.ff-line.avg::before{content:"";position:absolute;top:2px;left:-7px;width:12px;height:12px;background:var(--pos)}
.ff-line.avg b{color:var(--pos);left:10px}
.ff-axis{position:relative;margin-left:var(--lw);margin-right:var(--vw);height:26px;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.ff-axis span{position:absolute;top:6px;transform:translateX(-50%)}

.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:34px;border-top:2px solid var(--text)}
.verdict > div{padding:18px 20px 4px;border-left:1px solid var(--line)}
.verdict > div:first-child{padding-left:0;border-left:0}
.verdict .v-l{font-size:14px;font-weight:700;margin:0}
.verdict .v-v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:4px 0 0;font-variant-numeric:tabular-nums}
.verdict .v-d{font-size:14px;font-weight:700;margin:2px 0 0}
.verdict .avg{background:var(--text);color:var(--bg);padding:18px 20px 16px;border-left:0}
.verdict .avg .v-d{color:var(--green)}
.disc{background:var(--surface);padding:22px 26px;margin-top:48px;border-left:4px solid var(--text)}
.disc h3{margin-bottom:6px}
.disc p{margin:0;max-width:86ch;font-size:15px;color:var(--text2)}
.sign{margin-top:36px;font-size:15px}
.sign b{font-weight:700}

/* ---------- Rodapé ---------- */
footer{background:var(--surface);border-top:1px solid var(--line);font-size:13.5px;color:var(--text2)}
footer .wrap{padding-top:34px;padding-bottom:44px}
footer h2{font-size:16px;margin:0 0 10px;color:var(--text)}
footer ol{margin:0;padding:0 0 0 20px;columns:2;column-gap:44px}
footer li{margin-bottom:7px;break-inside:avoid}
footer .fd{margin-top:22px;padding-top:18px;border-top:1px solid var(--line2);max-width:96ch}
footer .fd b{color:var(--text)}

/* ---------- Ecrãs pequenos ---------- */
@media (max-width:980px){
  .brandrow{grid-template-columns:1fr auto;gap:18px 20px}
  .trip{grid-column:1 / -1;grid-row:2;justify-self:start}
  .route{width:64px}
}
@media (max-width:860px){
  .grid2,.grid2.wide-l{grid-template-columns:minmax(0,1fr);gap:36px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  .kpi:nth-child(odd){padding-left:0;border-left:0}
  .verdict{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdict > div:nth-child(3){padding-left:0;border-left:0}
  .verdict > div{padding-bottom:16px}
  .swot{grid-template-columns:1fr}
  .swot > div,.swot > div:nth-child(even){padding:20px 0;border-right:0}
  footer ol{columns:1}
}
@media (max-width:560px){
  .wrap{padding-left:18px;padding-right:18px}
  .brand-name{font-size:25px}
  .stop b{font-size:17px}
  .route{width:28px}
  main{padding-top:30px}
  .lead{font-size:17px}
  h2{font-size:22px}
  .kpi .k-v{font-size:32px}
  .step{grid-template-columns:minmax(0,1fr)}
  .step-n{margin-bottom:4px}
  .ff{--lw:92px;--vw:54px;font-size:13px}
  .ff-l small{font-size:11.5px}
  .ff-p{width:16px;height:16px;margin-left:-8px;top:19px}
  .wf-row{grid-template-columns:minmax(104px,36%) 1fr 76px;gap:8px}
  .tbl.fin td:first-child{min-width:170px;max-width:200px}
  .verdict .v-v{font-size:28px}
  .eq b{font-size:22px}
}

</style>
</head>
<body>
<header class="top">
  <div class="wrap brandrow">
    <div>
      <p class="ticker">NYSE: UBER</p>
      <p class="brand-name">Uber Technologies</p>
      <p class="brand-sub" id="brand-sub"></p>
    </div>
    <div class="trip" id="trip" role="img"></div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button data-lang="pt" aria-pressed="true">PT</button><button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<div class="tabsbar"><nav class="wrap tabs" id="tabs" role="tablist" aria-label="Separadores / Tabs"></nav></div>
<div class="notice"><div class="wrap" id="notice"></div></div>
<main class="wrap" id="view" role="tabpanel"></main>
<footer id="foot"></footer>
<div id="tip" role="tooltip"></div>

/* ---------- Estado e idioma ---------- */
const state = { lang: 'pt', tab: 'empresa', stmt: 'is' };
try {
  const s = JSON.parse(localStorage.getItem('uber-er') || '{}');
  if (s.lang === 'pt' || s.lang === 'en') state.lang = s.lang;
} catch (e) { /* sem armazenamento: usa as predefinições */ }
const save = () => { try { localStorage.setItem('uber-er', JSON.stringify({ lang: state.lang })); } catch (e) {} };
const L = (pt, en) => (state.lang === 'pt' ? pt : en);

/* ---------- Formatação de números ---------- */
function nf(v, d = 0) {
  if (v == null || Number.isNaN(v)) return '';
  const neg = v < 0 && Math.abs(v).toFixed(d) != 0;
  let [i, f] = (Math.abs(v) + 1e-9).toFixed(d).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, state.lang === 'pt' ? '\u00A0' : ',');
  return (neg ? '\u2212' : '') + i + (f ? (state.lang === 'pt' ? ',' : '.') + f : '');
}
const pc = (v, d = 1) => (v == null ? '' : nf(v * 100, d) + '%');
const sg = (v, d = 1) => (v == null ? '' : (v > 0 ? '+' : '') + pc(v, d));
const usd = (v, d = 2) => (state.lang === 'pt' ? 'USD\u00A0' + nf(v, d) : (v < 0 ? '\u2212$' : '$') + nf(Math.abs(v), d));
const bn = (vM, d = 1) => (state.lang === 'pt' ? 'USD\u00A0' + nf(vM / 1000, d) + ' mil milhões' : '$' + nf(vM / 1000, d) + ' billion');
const xf = (v, d = 2) => (v == null ? '' : nf(v, d) + 'x');
const cls = v => (v == null ? '' : v >= 0 ? 'pos' : 'neg');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const last = a => a[a.length - 1];

/* ---------- Registo de gráficos ---------- */
let CH = [], cid = 0;
function chart(fn) { const id = 'ch' + (cid++); CH.push([id, fn]); return `<div class="chart" id="${id}"></div>`; }
function drawCharts() { CH.forEach(([id, fn]) => { const el = document.getElementById(id); if (el) fn(el); }); }

function legend(items) {
  return `<ul class="legend">${items.map(it => `<li><i class="${it.line ? 'ln' : ''}${it.proj ? ' pj' : ''}" style="background:${it.color}"></i>${it.name}</li>`).join('')}</ul>`;
}

function niceTicks(lo, hi, count = 4) {
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return t;
}

/* Colunas (agrupadas ou empilhadas), com linha opcional em escala própria */
function colChart(el, o) {
  const W = Math.max(260, el.clientWidth), Ht = o.height || 280;
  const m = { t: o.line ? 30 : 22, r: 4, b: o.sub ? 40 : 24, l: o.noAxis ? 2 : 44 };
  const cats = o.cats, n = cats.length, S = o.series;
  let lo = 0, hi = 0;
  if (o.stacked) {
    cats.forEach((_, i) => { let p = 0, q = 0; S.forEach(s => { const v = s.values[i] || 0; if (v >= 0) p += v; else q += v; }); hi = Math.max(hi, p); lo = Math.min(lo, q); });
  } else S.forEach(s => s.values.forEach(v => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } }));
  if (o.max != null) hi = Math.max(hi, o.max);
  let ticks = o.pct100 ? [0, 25, 50, 75, 100] : niceTicks(lo, hi, o.ticks || 4);
  lo = ticks[0]; hi = last(ticks);
  const iw = W - m.l - m.r, ih = Ht - m.t - m.b;
  const y = v => m.t + ih * (1 - (v - lo) / (hi - lo));
  const band = iw / n, pad = Math.min(band * 0.2, 16), gw = band - 2 * pad, bw = o.stacked ? gw : gw / S.length;
  const fmt = o.fmt || (v => nf(v));
  const afmt = o.axisFmt || (o.pct100 ? fmt : (t => nf(t, ticks.every(Number.isInteger) ? 0 : 1)));
  let g = '';
  if (!o.noAxis) ticks.forEach(t => { g += `<line class="${t === 0 ? 'zero' : 'gridl'}" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${afmt(t)}</text>`; });
  else g += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  cats.forEach((c, i) => {
    const x0 = m.l + i * band + pad, proj = o.projFrom != null && i >= o.projFrom;
    let up = 0, dn = 0;
    S.forEach((s, k) => {
      const v = s.values[i]; if (v == null) return;
      let x, y1, h;
      if (o.stacked) { x = x0; if (v >= 0) { y1 = y(up + v); h = y(up) - y1; up += v; } else { y1 = y(dn); h = y(dn + v) - y1; dn += v; } }
      else { x = x0 + k * bw; y1 = v >= 0 ? y(v) : y(0); h = Math.abs(y(v) - y(0)); }
      const w = Math.max(1, bw - (o.stacked ? 0 : 2));
      g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}" style="fill:${s.color}${proj ? ';opacity:.38' : ''}" data-tip="${esc(c + (S.length > 1 ? ', ' + s.name : '') + ': ' + (o.tipFmt || fmt)(v))}"/>`;
      if (o.stacked && o.segLabels && h > 17 && w > 34) g += `<text x="${(x + w / 2).toFixed(1)}" y="${(y1 + h / 2 + 4).toFixed(1)}" text-anchor="middle" style="fill:${s.on || '#fff'};font-weight:700">${fmt(v)}</text>`;
      if (!o.stacked && o.labels !== false && w >= (o.minLabelW || 30)) g += `<text class="vl" x="${(x + w / 2).toFixed(1)}" y="${(v >= 0 ? y1 - 6 : y1 + h + 14).toFixed(1)}" text-anchor="middle">${fmt(v)}</text>`;
    });
    if (o.stacked && o.totals) g += `<text class="vl" x="${(x0 + gw / 2).toFixed(1)}" y="${(y(up) - 6).toFixed(1)}" text-anchor="middle">${fmt(o.totals[i])}</text>`;
    g += `<text x="${(x0 + gw / 2).toFixed(1)}" y="${Ht - m.b + 16}" text-anchor="middle" style="fill:var(--text);font-weight:600">${c}</text>`;
    if (o.sub) g += `<text x="${(x0 + gw / 2).toFixed(1)}" y="${Ht - m.b + 32}" text-anchor="middle">${o.sub[i] || ''}</text>`;
  });
  if (o.line) {
    const lv = o.line.values, vals = lv.filter(v => v != null);
    const l0 = o.line.min != null ? o.line.min : Math.min(...vals), l1 = o.line.max != null ? o.line.max : Math.max(...vals);
    const ly = v => m.t + 4 + (ih * 0.55) * (1 - (v - l0) / ((l1 - l0) || 1));
    let d = '', pts = '';
    lv.forEach((v, i) => {
      if (v == null) return;
      const x = m.l + i * band + band / 2, yy = ly(v);
      d += (d ? 'L' : 'M') + x.toFixed(1) + ' ' + yy.toFixed(1);
      pts += `<circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="4" style="fill:var(--bg);stroke:${o.line.color};stroke-width:2" data-tip="${esc(cats[i] + ', ' + o.line.name + ': ' + o.line.fmt(v))}"/><text x="${x.toFixed(1)}" y="${(yy - 10).toFixed(1)}" text-anchor="middle" style="fill:${o.line.color};font-weight:700">${o.line.fmt(v)}</text>`;
    });
    g += `<path d="${d}" style="fill:none;stroke:${o.line.color};stroke-width:2"/>` + pts;
  }
  el.innerHTML = `<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(o.aria || '')}">${g}</svg>`;
}

/* Linhas */
function lineChart(el, o) {
  const W = Math.max(260, el.clientWidth), Ht = o.height || 280;
  const m = { t: 18, r: 54, b: 24, l: 46 };
  const cats = o.cats, n = cats.length;
  let lo = Infinity, hi = -Infinity;
  o.series.forEach(s => s.values.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (o.zero) lo = Math.min(lo, 0);
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = last(ticks);
  const iw = W - m.l - m.r, ih = Ht - m.t - m.b;
  const x = i => m.l + (n === 1 ? iw / 2 : iw * i / (n - 1)), y = v => m.t + ih * (1 - (v - lo) / (hi - lo));
  const fmt = o.fmt || (v => nf(v));
  let g = '';
  ticks.forEach(t => { g += `<line class="${t === 0 ? 'zero' : 'gridl'}" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${(o.axisFmt || fmt)(t)}</text>`; });
  cats.forEach((c, i) => { g += `<text x="${x(i)}" y="${Ht - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${c}</text>`; });
  const ends = [];
  o.series.forEach(s => {
    let d = '', pts = '';
    s.values.forEach((v, i) => {
      if (v == null) return;
      d += (d ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1);
      pts += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" style="fill:${s.color};stroke:var(--bg);stroke-width:1.5" data-tip="${esc(cats[i] + ', ' + s.name + ': ' + fmt(v))}"/>`;
    });
    g += `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2.5"/>` + pts;
    ends.push({ y: y(last(s.values)), t: fmt(last(s.values)), c: s.color });
  });
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach(e => { g += `<text x="${W - m.r + 8}" y="${e.y + 4}" style="fill:${e.c};font-weight:700">${e.t}</text>`; });
  el.innerHTML = `<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(o.aria || '')}">${g}</svg>`;
}

/* Barras horizontais (HTML) */
function hbars(items, o = {}) {
  const max = o.max || Math.max(...items.map(i => i.value));
  return `<ul class="hb">${items.map(it => `<li><div class="hb-l">${it.label}${it.note ? `<small>${it.note}</small>` : ''}</div><div class="hb-t"><div class="hb-b" style="width:${(Math.max(it.value, 0) / max * (o.span || 78)).toFixed(2)}%;background:${it.color || 'var(--text)'}"></div><span class="hb-v">${(o.fmt || nf)(it.value)}</span></div></li>`).join('')}</ul>`;
}

/* Cascata horizontal (HTML): ponte entre dois valores */
function waterfall(steps, o = {}) {
  let run = 0; const rows = [];
  steps.forEach(s => {
    if (s.type === 'total') { rows.push({ ...s, a: 0, b: s.value }); run = s.value; }
    else { rows.push({ ...s, a: run, b: run + s.value }); run += s.value; }
  });
  const max = Math.max(...rows.map(r => Math.max(r.a, r.b))), min = Math.min(0, ...rows.map(r => Math.min(r.a, r.b)));
  const px = v => ((v - min) / (max - min) * 100);
  const fmt = o.fmt || nf;
  return `<div class="wf">${rows.map(r => {
    const l = Math.min(px(r.a), px(r.b)), w = Math.abs(px(r.b) - px(r.a));
    const color = r.type === 'total' ? 'var(--text)' : r.value >= 0 ? (o.posColor || 'var(--blue)') : 'var(--neg)';
    return `<div class="wf-row ${r.type === 'total' && r.rule ? 'total' : ''}"><div class="wf-l">${r.label}</div><div class="wf-t"><div class="wf-b" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;background:${color}"></div></div><div class="wf-v">${r.type === 'total' ? fmt(r.value) : (r.value > 0 ? '+' : '') + fmt(r.value)}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- Sensibilidade dinâmica: o leitor escolhe o WACC e o g ---------- */
/* Posições em décimas de ponto percentual. k = desvio do WACC face ao cenário base; gi = g x 1000. */
const SENS = { dcf: { k: 0, gi: null }, eva: { k: 0, gi: null } };
const SENS_RANGE = { kMin: -30, kMax: 40, gMin: 0, gMax: 40 };
function sensFn(kind) {
  const d = D.dcf, e = D.eva;
  if (kind === 'dcf') {
    const nopat5 = last(d.ocf) - last(d.da), roic5 = last(e.roic);
    return (w, g) => (d.fcf.reduce((a, f, t) => a + f / Math.pow(1 + w, t + 1), 0)
      + nopat5 * (1 + g) * (1 - g / roic5) / (w - g) / Math.pow(1 + w, 5) - d.net_debt - d.minorities) / d.shares;
  }
  return (w, g) => {
    let a = e.ic[0];
    for (let t = 0; t < 4; t++) a += (e.nopat[t] - w * e.ic[t]) / Math.pow(1 + w, t + 1);
    a += ((e.nopat[4] - w * e.ic[4]) + (e.nopat[4] * (1 + g) - w * e.ic_t) / (w - g)) / Math.pow(1 + w, 5);
    return (a - e.net_debt - e.minorities) / e.shares;
  };
}
/* O cenário base usa o WACC exato do modelo; os restantes usam o WACC arredondado a 2 casas, como na tabela do Excel */
const sensW = k => (k === 0 ? D.wacc.wacc : Math.round(D.wacc.wacc * 10000) / 10000 + k / 1000);
const sensBaseG = kind => Math.round((kind === 'dcf' ? D.dcf.g : D.eva.g) * 1000);

function sensOut(kind) {
  const st = SENS[kind], f = sensFn(kind), price = D.val.price, g0 = sensBaseG(kind);
  if (st.gi == null) st.gi = g0;
  const val = f(sensW(st.k), st.gi / 1000), up = val / price - 1, isBase = st.k === 0 && st.gi === g0;
  const shade = v => {
    const u = v / price - 1, a = Math.min(Math.abs(u) / 0.5, 1);
    return `background:color-mix(in srgb, ${u >= 0 ? 'var(--pos)' : 'var(--neg)'} ${(8 + a * 34).toFixed(0)}%, var(--bg))`;
  };
  const ks = [-10, -5, 0, 5, 10].map(o => st.k + o), gs = [-10, -5, 0, 5, 10].map(o => st.gi + o);
  return `
  <div class="sx-res">
    <div><small>${L('Valor por ação com estas premissas', 'Value per share under these assumptions')}</small><b>${usd(val)}</b></div>
    <div><small>${L('Face à cotação de', 'Versus the share price of')} ${usd(price)}</small><b class="${cls(up)}">${sg(up, 0)}</b></div>
    <div class="sx-tag">${isBase ? `<span>${L('Cenário base do modelo', 'Model base case')}</span>` : `<button type="button" data-sens-reset="${kind}">${L('Repor o cenário base', 'Reset to base case')}</button>`}</div>
  </div>
  <div class="scroll"><table class="sens">
    <tr><td class="ax" colspan="6">${L('Colunas: crescimento na perpetuidade (g). Linhas: custo do capital (WACC). Valores em USD por ação.', 'Columns: perpetual growth (g). Rows: cost of capital (WACC). Figures in USD per share.')}</td></tr>
    <tr><th>WACC \\ g</th>${gs.map(g => `<th>${pc(g / 1000, 1)}</th>`).join('')}</tr>
    ${ks.map((k, i) => `<tr><th>${pc(sensW(k), 2)}</th>${gs.map((g, j) => `<td class="${i === 2 && j === 2 ? 'base' : ''}" style="${shade(f(sensW(k), g / 1000))}">${nf(f(sensW(k), g / 1000), 2)}</td>`).join('')}</tr>`).join('')}
  </table></div>
  <p class="sens-key"><span><i style="background:color-mix(in srgb, var(--pos) 30%, var(--bg))"></i>${L('Acima da cotação', 'Above the share price')}</span><span><i style="background:color-mix(in srgb, var(--neg) 30%, var(--bg))"></i>${L('Abaixo da cotação', 'Below the share price')}</span><span><i style="outline:2px solid var(--text);outline-offset:-2px"></i>${L('Premissas escolhidas', 'Selected assumptions')}</span></p>`;
}

function sensWidget(kind) {
  const st = SENS[kind], R = SENS_RANGE;
  if (st.gi == null) st.gi = sensBaseG(kind);
  const sl = (key, label, min, max, val, txt, lo, hi) => `<label class="sx-s"><span class="sx-top"><span class="sx-l">${label}</span><output data-sens-o="${key}">${txt}</output></span>
      <input type="range" min="${min}" max="${max}" step="1" value="${val}" data-sens="${kind}" data-key="${key}" aria-label="${esc(label)}" aria-valuetext="${txt}">
      <span class="sx-mm"><span>${lo}</span><span>${hi}</span></span></label>`;
  return `<div class="sx" id="sx-${kind}">
    <div class="sx-ctl">
      ${sl('k', L('Custo do capital (WACC)', 'Cost of capital (WACC)'), R.kMin, R.kMax, st.k, pc(sensW(st.k), 2), pc(sensW(R.kMin), 2), pc(sensW(R.kMax), 2))}
      ${sl('gi', L('Crescimento na perpetuidade (g)', 'Perpetual growth (g)'), R.gMin, R.gMax, st.gi, pc(st.gi / 1000, 1), pc(R.gMin / 1000, 1), pc(R.gMax / 1000, 1))}
    </div>
    <div class="sx-out" aria-live="polite">${sensOut(kind)}</div>
  </div>`;
}
function sensRefresh(kind, syncSliders) {
  const box = document.getElementById('sx-' + kind); if (!box) return;
  const st = SENS[kind];
  box.querySelectorAll('input[type=range]').forEach(inp => {
    const key = inp.dataset.key, txt = key === 'k' ? pc(sensW(st.k), 2) : pc(st.gi / 1000, 1);
    if (syncSliders) inp.value = st[key];
    inp.setAttribute('aria-valuetext', txt);
    box.querySelector(`[data-sens-o="${key}"]`).textContent = txt;
  });
  box.querySelector('.sx-out').innerHTML = sensOut(kind);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.sens) return;
  SENS[t.dataset.sens][t.dataset.key] = Number(t.value);
  sensRefresh(t.dataset.sens, false);
});
document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-sens-reset]') : null;
  if (!b) return;
  const kind = b.dataset.sensReset;
  SENS[kind] = { k: 0, gi: sensBaseG(kind) };
  sensRefresh(kind, true);
});

/* Tabela genérica: head = [texto], rows = [[células]]; colunas numéricas à direita */
function table(head, rows, o = {}) {
  const al = i => i === 0 ? '' : (o.left && o.left.includes(i)) ? ' class="l"' : ' class="r"';
  const minw = o.minw || (head.length >= 6 ? 560 : 0);

    const c = r.cls ? ` class="${r.cls}"` : ''; const cells = r.cells || r;
    return `<tr${c}>${cells.map((x, i) => `<td${al(i)}>${x == null ? '' : x}</td>`).join('')}</tr>`;
  }).join('')}</tbody></table></div>`;
}

/* ====================== 3. DESEMPENHO ====================== */
function viewPerf() {
  const h = D.hist, I = D.ind, s = D.seg, r = s.recon;
  const m = k => h[k].map((v, i) => v / h.rev[i]);
  const fcf = h.cfo.map((v, i) => v + h.capex[i]);
  const g = h.rev.map((v, i) => (i ? sg(growth(h.rev, i), 0) : ''));
  const other = (r.impair[i25] || 0) + (r.acq[i25] || 0) + (r.lease[i25] || 0) + (r.restr[i25] || 0);
  const ns = L('n.s.', 'n.m.');
  const row = (label, key, f, ok) => [label].concat(I[key].map((v, i) => (ok && !ok(i) ? `<span class="muted">${ns}</span>` : f(v))));
  const hd = t => ({ cls: 'hd', cells: [t, '', '', '', '', ''] });
  const ebitPos = i => D.hist.ebit[i + 1] > 0, ebitdaPos = i => D.hist.ebitda[i + 1] > 0, niPos = i => D.hist.ni[i + 1] > 0;
  return `
  <h1>${L(`De um prejuízo operacional de ${bn(-h.ebit[0])} a um lucro de ${bn(h.ebit[i25])} em cinco anos`, `From an operating loss of ${bn(-h.ebit[0])} to a profit of ${bn(h.ebit[i25])} in five years`)}</h1>
  <p class="lead">${L(`A receita multiplicou por ${nf(h.rev[i25] / h.rev[0], 1)} desde 2020 e os custos cresceram mais devagar: passaram de ${pc(h.costs[0] / h.rev[0], 0)} para ${pc(h.costs[i25] / h.rev[i25], 0)} da receita.`, `Revenue has grown ${nf(h.rev[i25] / h.rev[0], 1)} times since 2020 and costs have grown more slowly: from ${pc(h.costs[0] / h.rev[0], 0)} to ${pc(h.costs[i25] / h.rev[i25], 0)} of revenue.`)}</p>
  <p class="lead">${L(`O resultado líquido de 2024 e 2025 parece melhor do que é, porque inclui benefícios fiscais de ${bn(-h.tax[4])} e ${bn(-h.tax[5])} que não se repetem.`, `Net income for 2024 and 2025 looks better than it really is, because it includes tax benefits of ${bn(-h.tax[4])} and ${bn(-h.tax[5])} that will not recur.`)}</p>

  <section class="sec">
    <h2>${L('Receita e margens', 'Revenue and margins')}</h2>
    <div class="grid2">
      <div>
        <p class="cap">${L('Receita anual', 'Annual revenue')}</p>
        <p class="capsub">${L('Mil milhões de USD. Por baixo de cada ano, o crescimento face ao ano anterior', 'USD billion. Below each year, growth versus the previous year')}</p>
        ${chart(el => colChart(el, { cats: YL, sub: g, series: [{ name: L('Receita', 'Revenue'), color: C.ink, values: h.rev.map(v => v / 1000) }], fmt: v => nf(v, 1), height: 320 }))}
      </div>
      <div>
        <p class="cap">${L('Margens', 'Margins')}</p>
        <p class="capsub">${L('Em percentagem da receita', 'As a percentage of revenue')}</p>
        ${legend([{ name: L('Margem EBITDA', 'EBITDA margin'), color: C.ink, line: true }, { name: L('Margem EBIT', 'EBIT margin'), color: C.blue, line: true }, { name: L('Margem líquida', 'Net margin'), color: C.green, line: true }])}
        ${chart(el => lineChart(el, { cats: YL, fmt: v => nf(v * 100, 1) + '%', axisFmt: v => nf(v * 100, 0) + '%', height: 296,
          series: [{ name: L('Margem EBITDA', 'EBITDA margin'), color: C.ink, values: m('ebitda') }, { name: L('Margem EBIT', 'EBIT margin'), color: C.blue, values: m('ebit') }, { name: L('Margem líquida', 'Net margin'), color: C.green, values: m('ni') }] }))}
      </div>
    </div>
  </section>

  <section class="sec">
    <h2>${L('EBITDA, EBIT e resultado líquido', 'EBITDA, EBIT and net income')}</h2>
    <p class="sub">${L('O EBITDA é o resultado operacional antes de depreciações e amortizações. O EBIT é o resultado operacional. O resultado líquido é o que sobra para os acionistas depois de juros, impostos e outros resultados. A Uber passou a dar lucro operacional em 2023.', 'EBITDA is operating profit before depreciation and amortisation. EBIT is operating profit. Net income is what is left for shareholders after interest, taxes and other items. Uber turned an operating profit in 2023.')}</p>
    <p class="capsub">${UNIT_M()}</p>
    ${legend([{ name: 'EBITDA', color: C.ink }, { name: 'EBIT', color: C.blue }, { name: L('Resultado líquido', 'Net income'), color: C.green }])}
    ${chart(el => colChart(el, { cats: YL, height: 360, minLabelW: 44, fmt: v => nf(v),
      series: [{ name: 'EBITDA', color: C.ink, values: h.ebitda }, { name: 'EBIT', color: C.blue, values: h.ebit }, { name: L('Resultado líquido', 'Net income'), color: C.green, values: h.ni }] }))}
    <div class="mt"></div>
    ${table([''].concat(YL), [
      [L('Receita', 'Revenue')].concat(h.rev.map(v => nf(v))),
      ['EBITDA'].concat(h.ebitda.map(v => nf(v))),
      ['EBIT'].concat(h.ebit.map(v => nf(v))),
      [L('Resultado líquido atribuível à Uber', 'Net income attributable to Uber')].concat(h.ni.map(v => nf(v))),
      [L('Resultado por ação diluído (USD)', 'Diluted earnings per share (USD)')].concat(h.eps.map(v => nf(v, 2))),
    ], { cls: 'compact' })}
    <div class="grid2 mt">
      <div>
        <h3>${L('Porque é que o meu EBITDA é mais baixo do que o da Uber', 'Why my EBITDA is lower than Uber\u2019s')}</h3>
        <p style="color:var(--text2);max-width:56ch">${L(`A Uber publica um EBITDA ajustado de ${bn(s.aebitda.tot[i25])} em 2025, que deixa de fora a remuneração em ações e os custos legais e regulatórios. Neste estudo uso o EBITDA contabilístico (EBIT mais depreciações e amortizações), de ${bn(h.ebitda[i25])}, porque esses custos são reais.`, `Uber reports Adjusted EBITDA of ${bn(s.aebitda.tot[i25])} for 2025, which leaves out stock-based compensation and legal and regulatory costs. In this study I use accounting EBITDA (EBIT plus depreciation and amortisation), ${bn(h.ebitda[i25])}, because those costs are real.`)}</p>
      </div>
      <div>
        <p class="cap">${L('Do EBITDA ajustado ao resultado operacional, 2025', 'From Adjusted EBITDA to operating income, 2025')}</p>
        <p class="capsub">${UNIT_M()}</p>
        ${waterfall([
          { label: L('EBITDA ajustado (Uber)', 'Adjusted EBITDA (Uber)'), value: s.aebitda.tot[i25], type: 'total' },
          { label: L('Remuneração em ações', 'Stock-based compensation'), value: r.sbc[i25] },
          { label: L('Custos legais e regulatórios', 'Legal and regulatory costs'), value: r.legal[i25] },
          { label: L('Outros ajustamentos', 'Other adjustments'), value: other },
          { label: 'EBITDA', value: h.ebitda[i25], type: 'total', rule: true },
          { label: L('Depreciações e amortizações', 'Depreciation and amortisation'), value: r.da[i25] },
          { label: L('Resultado operacional (EBIT)', 'Operating income (EBIT)'), value: h.ebit[i25], type: 'total', rule: true },
        ])}
      </div>
    </div>
  </section>

  <section class="sec">
    <h2>${L('Cash flow', 'Cash flow')}</h2>
    <p class="sub">${L(`A operação gerou ${bn(h.cfo[i25])} de caixa em 2025 e o investimento em ativos fixos foi de apenas ${nf(-h.capex[i25])} milhões de USD. É um negócio que precisa de pouco capital. O imposto pago em dinheiro foi de ${nf(h.cash_tax[i25])} milhões de USD.`, `Operations generated ${bn(h.cfo[i25])} of cash in 2025 and capital expenditure was only $${nf(-h.capex[i25])} million. This is a business that needs little capital. Cash taxes paid were $${nf(h.cash_tax[i25])} million.`)}</p>
    <p class="capsub">${UNIT_M()}</p>
    ${legend([{ name: L('Cash flow operacional', 'Operating cash flow'), color: C.ink }, { name: L('Free cash flow (cash flow operacional menos investimento)', 'Free cash flow (operating cash flow minus capital expenditure)'), color: C.green }])}
    ${chart(el => colChart(el, { cats: YL, height: 320, minLabelW: 40, fmt: v => nf(v), series: [{ name: L('Cash flow operacional', 'Operating cash flow'), color: C.ink, values: h.cfo }, { name: 'Free cash flow', color: C.green, values: fcf }] }))}
  </section>

  <section class="sec">
    <h2>${L('Indicadores', 'Key ratios')}</h2>
    <p class="sub">${L('Rácios calculados a partir das demonstrações financeiras, de 2021 a 2025.', 'Ratios calculated from the financial statements, 2021 to 2025.')}</p>
    ${table([''].concat(D.ind_years), [
      hd(L('Rendibilidade', 'Profitability')),
      row(L('Crescimento da receita', 'Revenue growth'), 'cresc', v => sg(v)),
      row(L('Margem bruta', 'Gross margin'), 'm_bruta', v => pc(v)),
      row(L('Margem EBITDA', 'EBITDA margin'), 'm_ebitda', v => pc(v)),
      row(L('Margem EBIT', 'EBIT margin'), 'm_ebit', v => pc(v)),
      row(L('Margem líquida', 'Net margin'), 'm_liq', v => pc(v)),
      row(L('Rendibilidade do capital próprio (ROE)', 'Return on equity (ROE)'), 'roe', v => pc(v)),
      row(L('Rendibilidade do ativo (ROA)', 'Return on assets (ROA)'), 'roa', v => pc(v)),
      row(L('Rendibilidade do capital investido (ROIC)', 'Return on invested capital (ROIC)'), 'roic', v => pc(v)),
      hd(L('Liquidez', 'Liquidity')),
      row(L('Liquidez geral', 'Current ratio'), 'liq_geral', v => nf(v, 2)),
      row(L('Liquidez reduzida', 'Quick ratio'), 'liq_red', v => nf(v, 2)),
      row(L('Liquidez imediata', 'Cash ratio'), 'liq_imed', v => nf(v, 2)),
      row(L('Ativo corrente menos passivo corrente (milhões de USD)', 'Current assets minus current liabilities (USD million)'), 'tesouraria', v => nf(v)),
      hd(L('Endividamento e estrutura financeira', 'Leverage and financial structure')),
      row(L('Autonomia financeira (capital próprio / ativo)', 'Equity ratio (equity / assets)'), 'auton', v => pc(v)),
      row(L('Endividamento (passivo / ativo)', 'Debt ratio (liabilities / assets)'), 'endiv', v => pc(v)),
      row(L('Solvabilidade (capital próprio / passivo)', 'Solvency (equity / liabilities)'), 'solv', v => nf(v, 2)),
      row(L('Dívida líquida / EBITDA', 'Net debt / EBITDA'), 'nd_ebitda', v => xf(v), ebitdaPos),
      row(L('Dívida líquida / capital próprio', 'Net debt / equity'), 'nd_cp', v => nf(v, 2)),
      row(L('Juros suportados / EBIT', 'Interest expense / EBIT'), 'juros_ebit', v => pc(v), ebitPos),
      hd(L('Atividade', 'Activity')),
      row(L('Rotação do ativo', 'Asset turnover'), 'rot', v => nf(v, 2)),
      row(L('Prazo médio de recebimento (dias)', 'Days sales outstanding'), 'pmr', v => nf(v, 0)),
      row(L('Prazo médio de pagamento (dias)', 'Days payable outstanding'), 'pmp', v => nf(v, 0)),
      row(L('Ciclo de caixa (dias)', 'Cash cycle (days)'), 'ciclo', v => nf(v, 0)),
      hd(L('Por ação e mercado', 'Per share and market')),
      row(L('Cash flow operacional (milhões de USD)', 'Operating cash flow (USD million)'), 'cf', v => nf(v)),
      row(L('Cash flow operacional por ação (USD)', 'Operating cash flow per share (USD)'), 'cf_acao', v => nf(v, 2)),
      row(L('Resultado por ação diluído (USD)', 'Diluted earnings per share (USD)'), 'eps', v => nf(v, 2)),
      row(L('Investimento em ativos fixos / receita', 'Capital expenditure / revenue'), 'capex_v', v => pc(v)),
      row(L('PER (cotação de fim de ano / resultado por ação)', 'P/E (year-end price / earnings per share)'), 'per', v => xf(v, 1), niPos),
    ], { cls: 'compact' })}
    <p class="note">${L('n.s. significa não significativo (o denominador é negativo). O ROE, o ROA, o ROIC e o PER de 2024 e 2025 estão inflacionados pelos benefícios fiscais desses anos. O ROIC usa a taxa efetiva de imposto de cada ano.', 'n.m. means not meaningful (the denominator is negative). ROE, ROA, ROIC and P/E for 2024 and 2025 are inflated by the tax benefits booked in those years. ROIC uses each year\u2019s effective tax rate.')}</p>
  </section>`;
}

/* ====================== 4. SWOT E RISCOS ====================== */
function viewSwot() {
  const h = D.hist, s = D.seg;
  const sev = (lvl, txt) => `<span class="sev l${lvl}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>${txt}`;
  const P = { baixa: L('Baixa por evento', 'Low per event'), mod: L('Moderada', 'Moderate'), elev: L('Elevada', 'High'), certa: L('Certa', 'Certain'), inc: L('Incerta', 'Uncertain'), jur: L('Moderada, por jurisdição', 'Moderate, by jurisdiction'), mat: L('Já aconteceu', 'Already happened') };
  const S = { bm: sev(1, L('Baixa a moderada', 'Low to moderate')), m: sev(2, L('Moderada', 'Moderate')), me: sev(3, L('Moderada a elevada', 'Moderate to high')), e: sev(3, L('Elevada', 'High')), mt: sev(4, L('Muito elevada', 'Very high')), v: sev(2, L('Variável', 'Variable')) };
  const head = [L('Risco', 'Risk'), L('O que está em causa', 'What is at stake'), L('Probabilidade', 'Likelihood'), L('Gravidade', 'Severity')];
  const macro = [
    [L('Ciclo económico e consumo', 'Economic cycle and consumer spending'), L('Viagens e entregas são gastos que as famílias cortam primeiro numa recessão. As viagens de negócios e de aeroporto (15% das Gross Bookings de Mobility) são as mais sensíveis.', 'Rides and deliveries are among the first things households cut in a recession. Business and airport trips (15% of Mobility Gross Bookings) are the most exposed.'), P.mod, S.me],
    [L('Câmbio', 'Foreign exchange'), L('Cerca de metade da receita é gerada fora dos Estados Unidos, em moedas que oscilam face ao dólar.', 'About half of revenue is generated outside the United States, in currencies that move against the dollar.'), P.certa, S.bm],
    [L('Taxas de juro', 'Interest rates'), L('A dívida subiu para USD 12,7 mil milhões em junho de 2026 e a oferta pela Delivery Hero traz um crédito-ponte de EUR 14,2 mil milhões. Juros altos também reduzem o valor atual dos lucros futuros.', 'Debt rose to $12.7 billion by June 2026 and the Delivery Hero offer brings a €14.2 billion bridge loan. Higher rates also lower the present value of future profits.'), P.mod, S.m],
    [L('Custo dos seguros', 'Insurance costs'), L('Os custos de seguro subiram USD 851 milhões em 2025. As provisões de seguros somam USD 12,5 mil milhões.', 'Insurance costs rose by $851 million in 2025. Insurance reserves total $12.5 billion.'), P.mod, S.m],
    [L('Catástrofes e geopolítica', 'Catastrophes and geopolitics'), L('Pandemias, clima extremo, guerras ou terrorismo podem parar a operação, como em 2020. A Uber opera em mais de 70 países, alguns instáveis.', 'Pandemics, extreme weather, war or terrorism can halt operations, as in 2020. Uber operates in over 70 countries, some of them unstable.'), P.baixa, S.e],
    [L('Leis fiscais e laborais', 'Tax and labour laws'), L('Mudanças legislativas nacionais podem alterar o modelo. A alteração do IVA no Reino Unido, em janeiro de 2026, retirou USD 1,1 mil milhões de receita por trimestre, sem efeito no resultado operacional.', 'National law changes can reshape the model. The UK VAT change of January 2026 removed $1.1 billion of revenue per quarter, with no effect on operating income.'), P.elev, S.v],
  ];
  const micro = [
    [L('Condutores passarem a trabalhadores por conta de outrem', 'Drivers being reclassified as employees'), L('Há processos na Califórnia, Suíça, França e Nova Jérsia. Implicaria salário mínimo e segurança social, e mudaria a estrutura de custos.', 'There are cases in California, Switzerland, France and New Jersey. It would mean minimum wage and social security, and would change the cost structure.'), P.jur, S.mt],
    [L('Dependência de parceiros na condução autónoma', 'Reliance on partners for autonomous driving'), L('A Uber não tem tecnologia própria desde 2020. A Waymo poderá lançar um serviço direto depois de janeiro de 2028 e dispensar o intermediário.', 'Uber has had no in-house technology since 2020. Waymo could launch a direct service after January 2028 and cut out the middleman.'), P.mod, S.mt],
    [L('Compra da Delivery Hero', 'Delivery Hero acquisition'), L('Uma oferta de USD 14,8 mil milhões, financiada com um crédito-ponte, que depende de autorizações de concorrência e só fecha no segundo semestre de 2027.', 'A $14.8 billion offer, funded by a bridge loan, that depends on antitrust approvals and only closes in the second half of 2027.'), P.elev, S.me],
    [L('IVA no Reino Unido', 'UK VAT dispute'), L('As autoridades fiscais britânicas reclamam cerca de USD 1,8 mil milhões, já pagos e em contestação.', 'UK tax authorities claim about $1.8 billion, already paid and under appeal.'), P.inc, S.e],
    [L('Concorrência', 'Competition'), L('É fácil entrar no mercado e mudar de aplicação. DoorDash, Lyft, Bolt, Amazon, Waymo e Tesla obrigam a dar incentivos e descontos.', 'Entering the market and switching apps is easy. DoorDash, Lyft, Bolt, Amazon, Waymo and Tesla force Uber to offer incentives and discounts.'), P.elev, S.m],
    [L('Concentração', 'Concentration'), L(`Estados Unidos e Reino Unido valem ${pc((s.cty.us[i25] + s.cty.uk[i25]) / s.geo.tot[i25], 0)} da receita. A Uber depende também das lojas de aplicações da Apple e da Google.`, `The United States and the United Kingdom account for ${pc((s.cty.us[i25] + s.cty.uk[i25]) / s.geo.tot[i25], 0)} of revenue. Uber also depends on the Apple and Google app stores.`), P.mod, S.m],
    [L('Impostos vão subir', 'Taxes will rise'), L(`A Uber pagou apenas ${nf(h.cash_tax[i25])} milhões de USD de imposto em 2025, porque usa prejuízos antigos. Quando se esgotarem, a taxa sobe para níveis normais.`, `Uber paid only $${nf(h.cash_tax[i25])} million of tax in 2025, because it uses past losses. Once they run out, the tax rate will return to normal levels.`), P.certa, S.e],
    [L('Qualidade do cash flow', 'Cash flow quality'), L('USD 2,66 mil milhões do cash flow operacional de 2025 vêm do aumento das provisões de seguros, dinheiro que um dia terá de pagar sinistros.', '$2.66 billion of 2025 operating cash flow comes from the build-up of insurance reserves, money that will one day have to pay claims.'), P.mod, S.m],
    [L('Mais dívida', 'More debt'), L('A dívida subiu de USD 10,5 para 12,7 mil milhões em seis meses e a caixa desceu. A Uber admite que poderá precisar de mais capital.', 'Debt rose from $10.5 to $12.7 billion in six months while cash fell. Uber says it may need additional capital.'), P.mod, S.m],
    [L('Participações noutras empresas', 'Stakes in other companies'), L('As participações na Didi, Grab e Aurora mexem com os resultados. No 1.º semestre de 2026 a Didi desvalorizou USD 1,1 mil milhões e a Grab USD 654 milhões.', 'The stakes in Didi, Grab and Aurora swing reported earnings. In the first half of 2026 Didi lost $1.1 billion in value and Grab $654 million.'), P.certa, S.m],
    [L('Segurança e incidentes', 'Safety and incidents'), L('Acidentes e incidentes com passageiros são um risco jurídico e de reputação permanente.', 'Accidents and incidents involving riders are a permanent legal and reputational risk.'), P.certa, S.m],
    [L('Mudança de CFO', 'CFO turnover'), L('É o terceiro CFO em três anos, num momento de grande complexidade financeira.', 'This is the third CFO in three years, at a time of great financial complexity.'), P.mat, S.m],
  ];
  const fcf25 = h.cfo[i25] + h.capex[i25];
  const li = a => a.map(x => `<li>${x}</li>`).join('');
  return `
  <h1>${L('Escala e geração de caixa raras, com duas dependências externas: a condução autónoma e os reguladores', 'Rare scale and cash generation, with two external dependencies: autonomous driving and regulators')}</h1>
  <p class="lead">${L('A análise SWOT resume o que a Uber tem de bom e de mau por dentro (forças e fraquezas) e o que vem de fora (oportunidades e ameaças).', 'The SWOT analysis sums up what is good and bad inside Uber (strengths and weaknesses) and what comes from outside (opportunities and threats).')}</p>

  <section class="sec" style="border-top:0;padding-top:0;margin-top:36px">
    <div class="swot">
      <div><h3><i style="background:var(--pos)"></i>${L('Forças', 'Strengths')}</h3><ul>${li([
        L(`Escala: ${nf(last(s.mapc))} milhões de consumidores ativos por mês e ${nf(last(s.trips) / 1000, 1)} mil milhões de viagens em 2025.`, `Scale: ${nf(last(s.mapc))} million monthly active consumers and ${nf(last(s.trips) / 1000, 1)} billion trips in 2025.`),
        L('Vários produtos na mesma aplicação: quem usa Mobility e Delivery gasta mais de 3 vezes o que gasta quem usa só um.', 'Several products in one app: people who use both Mobility and Delivery spend more than 3 times as much as single-product users.'),
        L(`Custos a crescer menos do que a receita: de ${pc(h.costs[4] / h.rev[4], 0)} para ${pc(h.costs[i25] / h.rev[i25], 0)} da receita em 2025.`, `Costs growing more slowly than revenue: from ${pc(h.costs[4] / h.rev[4], 0)} to ${pc(h.costs[i25] / h.rev[i25], 0)} of revenue in 2025.`),
        L(`Geração de caixa: free cash flow de ${bn(fcf25)} em 2025.`, `Cash generation: free cash flow of ${bn(fcf25)} in 2025.`),
        L('Fidelização: Uber One com mais de 50 milhões de membros e publicidade acima de USD 2,5 mil milhões por ano.', 'Loyalty: Uber One with over 50 million members and advertising above $2.5 billion a year.'),
        L(`Governance: uma só classe de ações, conselho 90% independente e recompras de ${bn(-h.buyback[i25])} em 2025.`, `Governance: a single share class, a 90% independent board and ${bn(-h.buyback[i25])} of buybacks in 2025.`),
      ])}</ul></div>
      <div><h3><i style="background:var(--neg)"></i>${L('Fraquezas', 'Weaknesses')}</h3><ul>${li([
        L('Sem tecnologia própria de condução autónoma desde 2020. Depende de mais de 20 parceiros, alguns potenciais concorrentes.', 'No in-house autonomous driving technology since 2020. It relies on more than 20 partners, some of them potential competitors.'),
        L('Mudar de aplicação custa pouco e os efeitos de rede são locais, o que permite a rivais como a Bolt competir cidade a cidade.', 'Switching apps is cheap and network effects are local, which lets rivals such as Bolt compete city by city.'),
        L('Segundo lugar nas entregas nos Estados Unidos: 26% de quota, contra 61% da DoorDash.', 'Second place in US delivery: a 26% share, against 61% for DoorDash.'),
        L(`Concentração: Estados Unidos e Reino Unido pesam ${pc((s.cty.us[i25] + s.cty.uk[i25]) / s.geo.tot[i25], 0)} da receita.`, `Concentration: the United States and the United Kingdom account for ${pc((s.cty.us[i25] + s.cty.uk[i25]) / s.geo.tot[i25], 0)} of revenue.`),
        L(`A Freight perde dinheiro (EBITDA ajustado de ${nf(s.aebitda.fre[i25])} milhões de USD em 2025).`, `Freight loses money (Adjusted EBITDA of ${nf(s.aebitda.fre[i25])} million USD in 2025).`),
        L('Lucro de 2025 inflacionado por um benefício fiscal que não se repete, e três CFO em três anos.', '2025 profit inflated by a one-off tax benefit, and three CFOs in three years.'),
      ])}</ul></div>
      <div><h3><i style="background:var(--blue)"></i>${L('Oportunidades', 'Opportunities')}</h3><ul>${li([
        L('Venda cruzada: só cerca de um em cada cinco consumidores usa Mobility e Delivery no mesmo mês.', 'Cross-selling: only about one in five consumers uses both Mobility and Delivery in the same month.'),
        L('Delivery Hero: a compra levaria a Uber a cerca de 99 mercados.', 'Delivery Hero: the acquisition would take Uber to about 99 markets.'),

      <div><h3><i style="background:var(--yellow)"></i>${L('Ameaças', 'Threats')}</h3><ul>${li([

        L('Impostos mais altos quando os prejuízos fiscais acumulados se esgotarem.', 'Higher taxes once accumulated tax losses are used up.'),
      ])}</ul></div>
    </div>

  <section class="sec">
    <h2>${L('Riscos macroeconómicos', 'Macroeconomic risks')}</h2>

    ${table(head, macro, { left: [1, 2, 3], cls: 'risk' })}
  </section>

  <section class="sec">
    <h2>${L('Riscos microeconómicos', 'Microeconomic risks')}</h2>
