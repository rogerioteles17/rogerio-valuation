    ${table(head, micro, { left: [1, 2, 3], cls: 'risk' })}
    <p class="note">${L('Gravidade numa escala de quatro níveis: baixa, moderada, elevada e muito elevada. A avaliação é minha.', 'Severity on a four-level scale: low, moderate, high and very high. The assessment is my own.')}</p>
  </section>`;
}

/* ====================== 5. DEMONSTRAÇÕES FINANCEIRAS ====================== */
function viewStmt() {
  const tabs = [['is', L('Demonstração de resultados', 'Income statement')], ['bs', L('Balanço', 'Balance sheet')], ['cf', L('Fluxos de caixa', 'Cash flow statement')]];
  const rows = D[state.stmt];
  const clean = t => t.replace(/\s+—\s+/g, ', ').replace(/ EBIT$/, ' (EBIT)');
  const cell = (v, d) => (v == null ? '' : v === 0 ? '–' : nf(v, d || 0));
  const withProj = state.stmt === 'is';
  const body = rows.map(r => {
    const k = r.k === 'h' ? 'hd' : r.k === 'hh' ? 'hd2' : r.k === 't' ? 'tot' : r.k === 's' ? 'subt' : '';
    const proj = withProj ? r.p.map(v => `<td class="r p">${cell(v, r.d)}</td>`).join('') : '';
    return `<tr class="${k}"><td>${clean(L(r.pt, r.en))}</td>${r.v.map(v => `<td class="r">${cell(v, r.d)}</td>`).join('')}${proj}</tr>`;
  }).join('');
  const headProj = withProj ? PY.map(y => `<th class="r p">${y}</th>`).join('') : '';
  const notes = {
    is: L('As colunas 2026E a 2030E, a cinzento, são a minha projeção. Parte da receita e da margem EBITDA, por isso o detalhe de custos por rubrica não é apresentado nesses anos. As premissas estão no separador DCF. Os juros obtidos só passaram a ter linha própria a partir de 2023. Em 2020, 2021 e 2022 (USD 55, 37 e 139 milhões) estão dentro de "Outros rendimentos (gastos), líquidos". O EBITDA é o resultado operacional mais as depreciações e amortizações.', 'The 2026E to 2030E columns, in grey, are my projection. It starts from revenue and the EBITDA margin, so the cost breakdown by line is not shown for those years. The assumptions are in the DCF tab. Interest income has only been shown as a separate line since 2023. For 2020, 2021 and 2022 ($55, $37 and $139 million) it sits within "Other income (expense), net". EBITDA is income from operations plus depreciation and amortisation.'),
    bs: L('O balanço de 2023 é o reexpresso no relatório de 2024. Célula em branco significa que a rubrica não foi apresentada nessa data.', 'The 2023 balance sheet is as restated in the 2024 report. A blank cell means the line item was not presented at that date.'),
    cf: L('2020 a 2022 conforme o relatório anual de 2022. 2023 a 2025 conforme o relatório anual de 2025. Célula em branco significa que a rubrica não foi apresentada nesse ano.', '2020 to 2022 as per the 2022 annual report. 2023 to 2025 as per the 2025 annual report. A blank cell means the line item was not presented in that year.'),
  };
  return `
  <h1>${L('Demonstrações financeiras consolidadas, de 2020 a 2025, e projeção até 2030', 'Consolidated financial statements, 2020 to 2025, and projection to 2030')}</h1>
  <p class="lead">${L('Valores em milhões de USD, exceto ações (milhares) e valores por ação. Normas US GAAP, tal como publicados nos relatórios anuais (Form 10-K). A demonstração de resultados inclui a minha projeção para 2026 a 2030.', 'Figures in USD million, except shares (thousands) and per-share amounts. US GAAP, as published in the annual reports (Form 10-K). The income statement includes my projection for 2026 to 2030.')}</p>
  <div style="margin-top:30px">
    <div class="seg" role="group" aria-label="${L('Escolher demonstração', 'Choose statement')}">${tabs.map(([id, t]) => `<button data-stmt="${id}" aria-pressed="${state.stmt === id}">${t}</button>`).join('')}</div>
    <div class="scroll"><table class="tbl fin compact${withProj ? ' wproj' : ''}"><thead><tr><th>${L('Rubrica', 'Line item')}</th>${Y.map(y => `<th class="r">${y}</th>`).join('')}${headProj}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">${notes[state.stmt]}</p>
  </div>`;
}

const step = (n, title, body) => `<section class="step"><div class="step-n">${n}</div><div><h2>${title}</h2>${body}</div></section>`;
const eq = parts => `<div class="eq">${parts.map(p => (typeof p === 'string' ? `<span class="op">${p}</span>` : `<div class="${p.res ? 'res' : ''}"><small>${p.l}</small><b>${p.v}</b></div>`)).join('')}</div>`;
const above = u => (u >= 0 ? L('acima da cotação', 'above the share price') : L('abaixo da cotação', 'below the share price'));

/* ====================== 6. DCF ====================== */
function viewDcf() {
  const d = D.dcf, w = D.wacc, co = D.co, v = D.val, h = D.hist, a = D.assump;
  const nopat = last(d.ocf) - last(d.da), roic = last(D.eva.roic);
  const cats8 = ['2023', '2024', '2025'].concat(PY);
  const rev8 = h.rev.slice(3).concat(d.rev).map(x => x / 1000);
  const mg8 = h.ebitda.slice(3).map((x, i) => x / h.rev[i + 3]).concat(d.ebitda.map((x, i) => x / d.rev[i]));
  const prow = (label, hist, proj, f, c) => ({ cls: c || '', cells: [label, hist == null ? '' : f(hist)].concat(proj.map(x => f(x))) });
  return `
  <h1>${L(`DCF: ${usd(v.dcf)} por ação, ${pc(Math.abs(v.up_dcf), 0)} ${above(v.up_dcf)}`, `DCF: ${usd(v.dcf)} per share, ${pc(Math.abs(v.up_dcf), 0)} ${above(v.up_dcf)}`)}</h1>
  <p class="lead">${L('O DCF (discounted cash flow) estima o dinheiro que a empresa vai gerar no futuro e traz esse valor para hoje, descontando-o a uma taxa que reflete o risco. Segue cinco passos.', 'A DCF (discounted cash flow) estimates the cash the company will generate in the future and brings it back to today, discounting it at a rate that reflects risk. It follows five steps.')}</p>

  ${step(1, L('Quanto custa o capital (WACC)', 'What capital costs (WACC)'), `
    <p class="sub">${L('O WACC é a rendibilidade mínima que acionistas e credores exigem para financiar a Uber. É a taxa usada para descontar os cash flows futuros.', 'The WACC is the minimum return that shareholders and lenders require to fund Uber. It is the rate used to discount future cash flows.')}</p>
    ${eq([{ l: L('Custo do capital próprio', 'Cost of equity'), v: pc(w.ke, 2) }, '×', { l: L('Peso do capital próprio', 'Equity weight'), v: pc(w.w_e, 1) }, '+', { l: L('Custo da dívida, depois de imposto', 'After-tax cost of debt'), v: pc(w.kd_at, 2) }, '×', { l: L('Peso da dívida', 'Debt weight'), v: pc(w.w_d, 1) }, '=', { l: 'WACC', v: pc(w.wacc, 2), res: true }])}
    ${table([L('Parâmetro', 'Input'), L('Valor', 'Value'), L('De onde vem', 'Where it comes from')], [
      [L('Taxa sem risco', 'Risk-free rate'), pc(w.rf, 2), L('Obrigações do Tesouro dos EUA a 10 anos.', '10-year US Treasury bonds.')],
      [L('Retorno do mercado', 'Market return'), pc(w.rm, 2), L('Retorno médio anual do índice NYSE Composite, de 2021 a 2025.', 'Average annual return of the NYSE Composite index, 2021 to 2025.')],
      [L('Prémio de risco do mercado', 'Equity risk premium'), pc(w.erp, 2), L('Retorno do mercado menos a taxa sem risco.', 'Market return minus the risk-free rate.')],
      ['Beta', nf(w.beta, 2), L('Mede quanto a ação oscila face ao mercado. Calculado com retornos diários da Uber e do NYSE Composite, de 2021 a 2025.', 'Measures how much the stock moves relative to the market. Calculated from daily returns of Uber and the NYSE Composite, 2021 to 2025.')],
      { cls: 'subt', cells: [L('Custo do capital próprio', 'Cost of equity'), pc(w.ke, 2), L(`Taxa sem risco + beta × prémio de risco: ${pc(w.rf, 2)} + ${nf(w.beta, 2)} × ${pc(w.erp, 2)}.`, `Risk-free rate + beta × risk premium: ${pc(w.rf, 2)} + ${nf(w.beta, 2)} × ${pc(w.erp, 2)}.`)] },
      [L('Custo da dívida', 'Cost of debt'), pc(w.kd, 2), L('Taxa de rendimento das obrigações da Uber.', 'Yield on Uber\u2019s bonds.')],
      [L('Taxa de imposto', 'Tax rate'), pc(w.tax, 0), L('Taxa federal dos EUA. Os juros são dedutíveis, por isso a dívida fica mais barata.', 'US federal rate. Interest is tax-deductible, which makes debt cheaper.')],
      { cls: 'subt', cells: [L('Custo da dívida, depois de imposto', 'After-tax cost of debt'), pc(w.kd_at, 2), `${pc(w.kd, 2)} × (1 \u2212 ${pc(w.tax, 0)}).`] },
      [L('Peso do capital próprio e da dívida', 'Equity and debt weights'), `${pc(w.w_e, 1)} / ${pc(w.w_d, 1)}`, L(`Capitalização bolsista de ${bn(co.mcap)} (cotação de ${usd(co.price_2025)} a 31/12/2025) e dívida líquida de ${bn(co.net_debt)}.`, `Market capitalisation of ${bn(co.mcap)} (share price of ${usd(co.price_2025)} on 31/12/2025) and net debt of ${bn(co.net_debt)}.`)],
    ], { left: [2], cls: 'compact', minw: 620 })}
  `)}

  ${step(2, L('Quanto dinheiro a Uber vai gerar de 2026 a 2030', 'How much cash Uber will generate from 2026 to 2030'), `
    <p class="sub">${L('As projeções partem de 2025 e assentam nestas premissas:', 'The projections start from 2025 and rest on these assumptions:')}</p>
    <ul class="bul">
      <li>${L(`<b>Receita:</b> cresce ${pc(D.proj.growth[0])} ao ano em 2026 e 2027 e ${pc(D.proj.growth[2])} ao ano de 2028 a 2030. São as taxas de crescimento esperadas por Damodaran para o setor de software nos Estados Unidos, a 2 e a 5 anos.`, `<b>Revenue:</b> grows ${pc(D.proj.growth[0])} a year in 2026 and 2027 and ${pc(D.proj.growth[2])} a year from 2028 to 2030. These are Damodaran\u2019s expected growth rates for the US software sector, over 2 and 5 years.`)}</li>
      <li>${L(`<b>EBITDA:</b> cresce ${pc(a.ebitda_cagr, 0)} ao ano em 2026 e 2027, o ritmo médio de 2023 a 2025. A margem EBITDA sobe de ${pc(h.ebitda[i25] / h.rev[i25])} em 2025 para ${pc(a.ebitda_margin_lt)} em 2027 e fica nesse nível.`, `<b>EBITDA:</b> grows ${pc(a.ebitda_cagr, 0)} a year in 2026 and 2027, the average pace of 2023 to 2025. The EBITDA margin rises from ${pc(h.ebitda[i25] / h.rev[i25])} in 2025 to ${pc(a.ebitda_margin_lt)} in 2027 and stays there.`)}</li>
      <li>${L(`<b>Imposto:</b> ${pc(a.tax, 0)} sobre o resultado operacional.`, `<b>Tax:</b> ${pc(a.tax, 0)} of operating income.`)}</li>
      <li>${L(`<b>Investimento:</b> ${pc(a.capex_pct)} da receita, a média de 2023 a 2025. O fundo de maneio é negativo e cresce com a receita, o que liberta caixa.`, `<b>Capital expenditure:</b> ${pc(a.capex_pct)} of revenue, the 2023 to 2025 average. Working capital is negative and grows with revenue, which releases cash.`)}</li>
    </ul>
    <div class="grid2 mt">
      <div>
        <p class="cap">${L('Receita e margem EBITDA', 'Revenue and EBITDA margin')}</p>
        <p class="capsub">${L('Receita em mil milhões de USD (colunas) e margem EBITDA (linha)', 'Revenue in USD billion (columns) and EBITDA margin (line)')}</p>
        ${legend([{ name: L('Histórico', 'Actual'), color: C.ink }, { name: L('Projeção', 'Projection'), color: C.ink, proj: true }, { name: L('Margem EBITDA', 'EBITDA margin'), color: C.blue, line: true }])}
        ${chart(el => colChart(el, { cats: cats8, projFrom: 3, series: [{ name: L('Receita', 'Revenue'), color: C.ink, values: rev8 }], fmt: x => nf(x, 0), tipFmt: x => nf(x, 1), height: 340, max: 240,
          line: { name: L('Margem EBITDA', 'EBITDA margin'), values: mg8, color: C.blue, fmt: x => nf(x * 100, 0) + '%', min: 0, max: 0.27 } }))}
      </div>
      <div>
        <p class="cap">${L('Free cash flow projetado', 'Projected free cash flow')}</p>
        <p class="capsub">${L('Mil milhões de USD: valor em cada ano e valor atual, depois de descontado', 'USD billion: value in each year and present value, after discounting')}</p>
        ${legend([{ name: 'Free cash flow', color: C.ink }, { name: L('Valor atual', 'Present value'), color: C.blue }])}
        ${chart(el => colChart(el, { cats: PY, series: [{ name: 'Free cash flow', color: C.ink, values: d.fcf.map(x => x / 1000) }, { name: L('Valor atual', 'Present value'), color: C.blue, values: d.pv_fcf.map(x => x / 1000) }], fmt: x => nf(x, 1), height: 340, minLabelW: 28 }))}
      </div>
    </div>
    <p class="cap mt">${L('Projeção do free cash flow', 'Free cash flow projection')}</p>
    <p class="capsub">${UNIT_M()}</p>
    ${table([''].concat(['2025'], PY), [
      prow(L('Receita', 'Revenue'), h.rev[i25], d.rev, x => nf(x)),
      prow(L('Crescimento', 'Growth'), growth(h.rev, i25), D.proj.growth, x => sg(x)),
      prow('EBITDA', h.ebitda[i25], d.ebitda, x => nf(x)),
      prow(L('Margem EBITDA', 'EBITDA margin'), h.ebitda[i25] / h.rev[i25], d.ebitda.map((x, i) => x / d.rev[i]), x => pc(x)),
      prow(L('Depreciações e amortizações', 'Depreciation and amortisation'), h.da[i25], d.da, x => nf(x)),
      prow(L('Resultado operacional (EBIT)', 'Operating income (EBIT)'), h.ebit[i25], d.ebit, x => nf(x), 'subt'),
      prow(L(`Imposto (${pc(a.tax, 0)})`, `Tax (${pc(a.tax, 0)})`), null, d.tax.map(x => -x), x => nf(x)),
      prow(L('Mais depreciações e amortizações', 'Plus depreciation and amortisation'), null, d.da, x => nf(x)),
      prow(L('Cash flow operacional', 'Operating cash flow'), null, d.ocf, x => nf(x), 'subt'),
      prow(L('Caixa libertada pelo fundo de maneio', 'Cash released by working capital'), null, d.dwc.map(x => -x), x => nf(x)),
      prow(L('Investimento em ativos fixos', 'Capital expenditure'), null, d.capex.map(x => -x), x => nf(x)),
      prow('Free cash flow', null, d.fcf, x => nf(x), 'tot'),
      prow(L('Fator de desconto', 'Discount factor'), null, d.df, x => nf(x, 3)),
      prow(L('Valor atual do free cash flow', 'Present value of free cash flow'), null, d.pv_fcf, x => nf(x), 'subt'),
    ], { cls: 'compact' })}
  `)}

  ${step(3, L('Quanto vale a Uber depois de 2030 (valor terminal)', 'What Uber is worth after 2030 (terminal value)'), `
    <p class="sub">${L(`Depois de 2030 assumo que a Uber cresce ${pc(d.g, 0)} ao ano para sempre.`, `After 2030 I assume Uber grows ${pc(d.g, 0)} a year forever.`)}</p>
    ${eq([{ l: L('Valor terminal em 2030 (milhões de USD)', 'Terminal value in 2030 (USD million)'), v: nf(d.tv), res: true }])}
    <p style="max-width:74ch">${L(`Trazido para hoje, o valor terminal vale ${bn(d.pv_tv)}, ou seja, <b>${pc(d.pv_tv / d.ev, 0)} do valor total da empresa</b>. Quase dois terços do valor dependem do que acontece depois de 2030, por isso o resultado é sensível ao WACC e à taxa de crescimento (ver passo 5).`, `Brought back to today, the terminal value is worth ${bn(d.pv_tv)}, that is, <b>${pc(d.pv_tv / d.ev, 0)} of the total value of the company</b>. Almost two thirds of the value depends on what happens after 2030, so the result is sensitive to the WACC and the growth rate (see step 5).`)}</p>
  `)}

  ${step(4, L('Do valor da empresa ao valor por ação', 'From enterprise value to value per share'), `
    <p class="sub">${L('Somo o valor atual dos cash flows e do valor terminal para obter o valor da empresa. Depois retiro o que pertence aos credores e aos sócios minoritários das subsidiárias.', 'I add the present value of the cash flows and of the terminal value to get the enterprise value. Then I take out what belongs to lenders and to minority partners in subsidiaries.')}</p>
    <p class="capsub">${UNIT_M()}</p>
    ${waterfall([
      { label: L('Valor atual dos free cash flows, 2026 a 2030', 'Present value of free cash flows, 2026 to 2030'), value: d.pv_explicit },
      { label: L('Valor atual do valor terminal', 'Present value of the terminal value'), value: d.pv_tv },
      { label: L('Valor da empresa (enterprise value)', 'Enterprise value'), value: d.ev, type: 'total', rule: true },
      { label: L('Dívida financeira líquida', 'Net financial debt'), value: -d.net_debt },
      { label: L('Interesses minoritários', 'Minority interests'), value: -d.minorities },
      { label: L('Valor do capital próprio', 'Equity value'), value: d.equity, type: 'total', rule: true },
    ])}
    <div class="mt">${eq([{ l: L('Valor do capital próprio (milhões de USD)', 'Equity value (USD million)'), v: nf(d.equity) }, '÷', { l: L('Ações (milhões)', 'Shares (millions)'), v: nf(d.shares, 1) }, '=', { l: L('Valor por ação', 'Value per share'), v: usd(d.value), res: true }])}</div>
    <p class="note">${L(`Dívida líquida: dívida financeira de ${nf(co.debt)} milhões de USD (inclui locações) menos caixa e equivalentes de ${nf(co.cash)} milhões (inclui caixa restrita), a 31/12/2025. Número de ações: média ponderada diluída de 2025.`, `Net debt: financial debt of $${nf(co.debt)} million (including leases) minus cash and equivalents of $${nf(co.cash)} million (including restricted cash), as of 31/12/2025. Share count: 2025 diluted weighted average.`)}</p>
  `)}

  ${step(5, L('E se as premissas mudarem (análise de sensibilidade)', 'What if the assumptions change (sensitivity analysis)'), `
    <p class="sub">${L('Mova as barras para escolher o custo do capital (WACC) e o crescimento na perpetuidade (g). O valor por ação e a tabela atualizam-se de imediato. A tabela mostra o valor para variações de meio ponto e de um ponto percentual à volta das premissas escolhidas.', 'Move the sliders to choose the cost of capital (WACC) and the perpetual growth rate (g). The value per share and the table update instantly. The table shows the value for changes of half a point and one percentage point around the selected assumptions.')}</p>
    ${sensWidget('dcf')}
  `)}`;
}

/* ====================== 7. EVA ====================== */
function viewEva() {
  const e = D.eva, v = D.val, co = D.co;
  return `
  <h1>${L(`EVA: ${usd(v.eva)} por ação, ${pc(Math.abs(v.up_eva), 0)} ${above(v.up_eva)}`, `EVA: ${usd(v.eva)} per share, ${pc(Math.abs(v.up_eva), 0)} ${above(v.up_eva)}`)}</h1>
  <p class="lead">${L('O EVA (economic value added) é o lucro que sobra depois de pagar o custo de todo o capital investido. Uma empresa só cria valor se a rendibilidade do capital (ROIC) for superior ao seu custo (WACC). O valor da empresa é o capital investido mais o valor atual dos EVA futuros.', 'EVA (economic value added) is the profit left after paying for the cost of all capital invested. A company only creates value if its return on capital (ROIC) is higher than its cost (WACC). The value of the company is the capital invested plus the present value of future EVA.')}</p>

  ${step(1, L('Quanto valor a Uber cria em cada ano', 'How much value Uber creates each year'), `
    ${eq([{ l: L('Quanto capital está aplicado no negócio', 'How much capital is tied up in the business'), v: L('Capital investido', 'Invested capital') }, '×', { l: L('Rendibilidade menos custo', 'Return minus cost'), v: 'ROIC \u2212 WACC' }, '=', { l: L('Valor criado no ano', 'Value created in the year'), v: 'EVA', res: true }])}
    <div class="grid2 wide-l">
      <div>
        <p class="capsub">${UNIT_M()}</p>
        ${table([''].concat(PY), [
          [L('Capital investido', 'Invested capital')].concat(e.ic.map(x => nf(x))),
          [L('Lucro operacional depois de imposto', 'After-tax operating profit')].concat(e.nopat.map(x => nf(x))),
          ['ROIC'].concat(e.roic.map(x => pc(x))),
          ['WACC'].concat(e.wacc.map(x => pc(x, 2))),
          { cls: 'tot', cells: ['EVA'].concat(e.eva.map(x => nf(x))) },
          [L('Fator de desconto', 'Discount factor')].concat(e.df.map(x => nf(x, 3))),
          { cls: 'subt', cells: [L('Valor atual do EVA', 'Present value of EVA')].concat(e.pv_eva.map(x => nf(x))) },
        ], { cls: 'compact' })}
      </div>
      <div>
        <p class="cap">${L('EVA projetado', 'Projected EVA')}</p>
        <p class="capsub">${UNIT_BN()}</p>
        ${chart(el => colChart(el, { cats: PY, series: [{ name: 'EVA', color: C.ink, values: e.eva.map(x => x / 1000) }], fmt: x => nf(x, 1), height: 260 }))}
      </div>
    </div>
    <p class="note">${L(`O ROIC projetado, entre ${pc(e.roic[0], 0)} e ${pc(Math.max(...e.roic), 0)}, fica muito acima do WACC de ${pc(e.wacc[0], 2)}. É por isso que o EVA é elevado e é também a premissa mais exigente deste método.`, `Projected ROIC, between ${pc(e.roic[0], 0)} and ${pc(Math.max(...e.roic), 0)}, sits well above the WACC of ${pc(e.wacc[0], 2)}. That is why EVA is high, and it is also the most demanding assumption in this method.`)}</p>
  `)}

  ${step(2, L('Valor criado depois de 2030 (valor terminal)', 'Value created after 2030 (terminal value)'), `
    <p class="sub">${L(`Depois de 2030 assumo que o EVA cresce ${pc(e.g, 0)} ao ano para sempre.`, `After 2030 I assume EVA grows ${pc(e.g, 0)} a year forever.`)}</p>
    ${eq([{ l: L('Valor terminal em 2030 (milhões de USD)', 'Terminal value in 2030 (USD million)'), v: nf(e.tv), res: true }])}
    <p style="max-width:74ch">${L(`Trazido para hoje, o valor terminal vale ${bn(e.pv_tv)}.`, `Brought back to today, the terminal value is worth ${bn(e.pv_tv)}.`)}</p>
  `)}

  ${step(3, L('Do capital investido ao valor por ação', 'From invested capital to value per share'), `
    <p class="sub">${L('Ao capital investido somo o market value added (MVA), que é o valor atual de todos os EVA futuros, incluindo o valor terminal. Depois retiro a dívida líquida e os interesses minoritários.', 'To invested capital I add market value added (MVA), which is the present value of all future EVA, including the terminal value. Then I take out net debt and minority interests.')}</p>
    <p class="capsub">${UNIT_M()}</p>
    ${waterfall([
      { label: L('Capital investido', 'Invested capital'), value: e.ic0, type: 'total' },
      { label: 'Market value added (MVA)', value: e.mva },
      { label: L('Valor da empresa (enterprise value)', 'Enterprise value'), value: e.ev, type: 'total', rule: true },
      { label: L('Dívida financeira líquida', 'Net financial debt'), value: -e.net_debt },
      { label: L('Interesses minoritários', 'Minority interests'), value: -e.minorities },
      { label: L('Valor do capital próprio', 'Equity value'), value: e.equity, type: 'total', rule: true },
    ])}
    <div class="mt">${eq([{ l: L('Valor do capital próprio (milhões de USD)', 'Equity value (USD million)'), v: nf(e.equity) }, '÷', { l: L('Ações (milhões)', 'Shares (millions)'), v: nf(e.shares, 1) }, '=', { l: L('Valor por ação', 'Value per share'), v: usd(e.value), res: true }])}</div>
    <p class="note">${L(`Em teoria, o DCF e o EVA deviam dar o mesmo valor. Aqui diferem (${usd(v.dcf)} contra ${usd(v.eva)}) porque o valor terminal é calculado de forma diferente em cada método.`, `In theory, DCF and EVA should give the same value. Here they differ (${usd(v.dcf)} versus ${usd(v.eva)}) because the terminal value is calculated differently in each method.`)}</p>
  `)}

  ${step(4, L('E se as premissas mudarem (análise de sensibilidade)', 'What if the assumptions change (sensitivity analysis)'), `
    <p class="sub">${L('Mova as barras para escolher o custo do capital (WACC) e o crescimento na perpetuidade (g). O valor por ação e a tabela atualizam-se de imediato. A tabela mostra o valor para variações de meio ponto e de um ponto percentual à volta das premissas escolhidas.', 'Move the sliders to choose the cost of capital (WACC) and the perpetual growth rate (g). The value per share and the table update instantly. The table shows the value for changes of half a point and one percentage point around the selected assumptions.')}</p>
    ${sensWidget('eva')}
  `)}`;
}

/* ====================== 8. MÚLTIPLOS ====================== */
const MULT = () => ({
  pe: ['P/E', L('Resultado líquido', 'Net income')], pbv: ['P/BV', L('Capital próprio', 'Shareholders\u2019 equity')],
  evebitda: ['EV/EBITDA', 'EBITDA'], evsales: ['EV/Sales', L('Receita', 'Revenue')], ps: ['P/S', L('Receita', 'Revenue')],
});
function viewMult() {
  const m = D.mult, v = D.val, co = D.co, h = D.hist, M = MULT();
  const hiM = m.apply.reduce((x, y) => (y.value > x.value ? y : x)), loM = m.apply.reduce((x, y) => (y.value < x.value ? y : x));
  const f = (x, d = 2) => (x == null ? `<span class="muted">${L('n.d.', 'n.a.')}</span>` : nf(x, d));
  const peers = m.peers.map(p => {
    const med = /mediana/i.test(p.name), ub = /uber/i.test(p.name);
    return { cls: med ? 'hl subt' : ub ? 'tot' : '', cells: [med ? L('Mediana dos pares', 'Peer median') : ub ? 'Uber' : p.name, f(p.pe), f(p.pbv), f(p.evebitda), f(p.evsales), f(p.ps), f(p.peg)] };
  });
  return `
  <h1>${L(`Múltiplos: ${usd(v.mult)} por ação, ${pc(Math.abs(v.up_mult), 0)} ${above(v.up_mult)}`, `Multiples: ${usd(v.mult)} per share, ${pc(Math.abs(v.up_mult), 0)} ${above(v.up_mult)}`)}</h1>
  <p class="lead">${L('Os múltiplos comparam a Uber com empresas parecidas. Vejo quanto o mercado paga por cada dólar de lucro, de capital próprio, de EBITDA ou de receita dessas empresas, e aplico a mediana aos números da Uber de 2025.', 'Multiples compare Uber with similar companies. I look at how much the market pays for each dollar of profit, equity, EBITDA or revenue at those companies, and apply the median to Uber\u2019s 2025 figures.')}</p>

  <section class="sec">
    <h2>${L('As empresas comparáveis', 'The comparable companies')}</h2>
    <p class="sub">${L('Seis empresas de mobilidade, entregas, viagens e plataformas digitais. Uso a mediana e não a média para que os valores extremos pesem menos.', 'Six companies in mobility, delivery, travel and digital platforms. I use the median rather than the mean so that extreme values weigh less.')}</p>
    ${table([L('Empresa', 'Company'), 'P/E', 'P/BV', 'EV/EBITDA', 'EV/Sales', 'P/S', 'PEG'], peers, { cls: 'compact' })}
    <p class="note">${L('P/E: cotação a dividir pelo lucro por ação. P/BV: cotação a dividir pelo capital próprio contabilístico por ação. EV/EBITDA e EV/Sales: valor da empresa (capital próprio mais dívida líquida) a dividir pelo EBITDA e pela receita. P/S: capitalização bolsista a dividir pela receita. PEG: P/E a dividir pelo crescimento esperado dos lucros. O PEG não entra na avaliação.', 'P/E: share price divided by earnings per share. P/BV: share price divided by book equity per share. EV/EBITDA and EV/Sales: enterprise value (equity plus net debt) divided by EBITDA and by revenue. P/S: market capitalisation divided by revenue. PEG: P/E divided by expected earnings growth. PEG is not used in the valuation.')}</p>
  </section>

  <section class="sec">
    <h2>${L('Quanto valeria a Uber com os múltiplos dos pares', 'What Uber would be worth on peer multiples')}</h2>
    <p class="sub">${L(`Cada múltiplo dá um valor diferente, entre ${usd(Math.min(...m.apply.map(a => a.value)))} e ${usd(Math.max(...m.apply.map(a => a.value)))} por ação. O valor final é a média simples dos cinco.`, `Each multiple gives a different value, between ${usd(Math.min(...m.apply.map(a => a.value)))} and ${usd(Math.max(...m.apply.map(a => a.value)))} per share. The final value is the simple average of the five.`)}</p>
    <div class="grid2">
      <div>
        <p class="cap">${L('Valor por ação segundo cada múltiplo', 'Value per share under each multiple')}</p>
        <p class="capsub">${L(`USD. Cotação de referência: ${nf(v.price, 2)}`, `USD. Reference share price: ${nf(v.price, 2)}`)}</p>
        ${hbars(m.apply.map(a => ({ label: M[a.key][0], value: a.value, color: C.ink })).concat([{ label: `<b>${L('Média', 'Average')}</b>`, value: m.value, color: C.blue }, { label: L('Cotação', 'Share price'), value: v.price, color: C.gray }]), { fmt: x => nf(x, 2), span: 72 })}
      </div>
      <div>
        <p class="capsub">${UNIT_M()}, ${L('exceto múltiplo e valor por ação', 'except multiple and value per share')}</p>
        ${table([L('Múltiplo', 'Multiple'), L('Indicador da Uber, 2025', 'Uber metric, 2025'), L('Mediana', 'Median'), L('Valor do capital próprio', 'Equity value'), L('Por ação', 'Per share')],
          m.apply.map(a => [`<b>${M[a.key][0]}</b>`, `${M[a.key][1]}: ${nf(a.base)}`, xf(a.mult), nf(a.equity), nf(a.value, 2)]).concat([{ cls: 'tot', cells: [L('Média', 'Average'), '', '', '', nf(m.value, 2)] }]), { cls: 'compact', left: [1], minw: 520 })}
        <p class="note">${L(`Nos múltiplos sobre o valor da empresa (EV/EBITDA e EV/Sales) retiro a dívida líquida de ${nf(co.net_debt)} milhões de USD e os interesses minoritários de ${nf(co.minorities)} milhões para chegar ao capital próprio. Valor por ação com ${nf(co.shares, 1)} milhões de ações.`, `For enterprise value multiples (EV/EBITDA and EV/Sales) I subtract net debt of $${nf(co.net_debt)} million and minority interests of $${nf(co.minorities)} million to reach equity value. Value per share based on ${nf(co.shares, 1)} million shares.`)}</p>
      </div>
    </div>
    <div class="disc" style="margin-top:32px">
      <h3>${L('Como ler este resultado', 'How to read this result')}</h3>
      <p>${L(`O ${M[hiM.key][0]} dá o valor mais alto (${usd(hiM.value)})${hiM.key === 'pe' ? `, porque usa o resultado líquido de 2025, que inclui um benefício fiscal de ${bn(-h.tax[i25])} que não se repete` : ''}. O valor mais baixo vem do ${M[loM.key][0]} (${usd(loM.value)}). A dispersão é grande, por isso este é o método menos preciso dos três.`, `${M[hiM.key][0]} gives the highest value (${usd(hiM.value)})${hiM.key === 'pe' ? `, because it uses 2025 net income, which includes a ${bn(-h.tax[i25])} tax benefit that will not recur` : ''}. The lowest value comes from ${M[loM.key][0]} (${usd(loM.value)}). The spread is wide, which makes this the least precise of the three methods.`)}</p>
    </div>
  </section>`;
}

function viewFim() {

  const lo = 40, hi = 210, px = x => ((x - lo) / (hi - lo) * 100).toFixed(2);
  const mv = m.apply.map(x => x.value), an = v.analysts.map(x => x.pt);
  const R = [
    ['DCF', L('sensibilidade', 'sensitivity'), Math.min(...d.sens.flat()), Math.max(...d.sens.flat()), v.dcf],
    ['EVA', L('sensibilidade', 'sensitivity'), Math.min(...e.sens.flat()), Math.max(...e.sens.flat()), v.eva],
    [L('Múltiplos', 'Multiples'), L('do menor ao maior', 'lowest to highest'), Math.min(...mv), Math.max(...mv), v.mult],
    [L('Analistas', 'Analysts'), L('preços-alvo', 'price targets'), Math.min(...an), Math.max(...an), v.analysts_avg],
  ];
  const tile = (l, val, up, c) => `<div class="${c || ''}"><p class="v-l">${l}</p><p class="v-v">${usd(val)}</p><p class="v-d ${c ? '' : cls(up)}">${sg(up, 0)} ${L('face à cotação', 'vs share price')}</p></div>`;
  const fdate = s => { const [y, mo, dd] = s.split('-'); return state.lang === 'pt' ? `${dd}/${mo}/${y}` : `${dd}/${mo}/${y}`; };
  return `
  <h1>${L(`Valor médio estimado de ${usd(v.avg)} por ação, ${pc(v.up_avg, 0)} acima da cotação de ${usd(v.price)}`, `Average estimated value of ${usd(v.avg)} per share, ${pc(v.up_avg, 0)} above the share price of ${usd(v.price)}`)}</h1>
  <p class="lead">${L(`Os três métodos apontam no mesmo sentido: pelas minhas contas, a ação negoceia abaixo do valor que estimo. O método mais prudente (EVA) fica ${pc(v.up_eva, 0)} acima da cotação e o mais otimista (múltiplos) ${pc(v.up_mult, 0)} acima.`, `All three methods point the same way: by my numbers, the stock trades below the value I estimate. The most cautious method (EVA) sits ${pc(v.up_eva, 0)} above the share price and the most optimistic (multiples) ${pc(v.up_mult, 0)} above.`)}</p>

  <div class="verdict">
    ${tile('DCF', v.dcf, v.up_dcf)}
    ${tile('EVA', v.eva, v.up_eva)}
    ${tile(L('Múltiplos', 'Multiples'), v.mult, v.up_mult)}
    ${tile(L('Média dos três métodos', 'Average of the three methods'), v.avg, v.up_avg, 'avg')}
  </div>

  <section class="sec">
    <h2>${L('Da cotação ao valor estimado', 'From share price to estimated value')}</h2>
    <p class="sub">${L('Cada linha mostra o intervalo de valores de um método (barra cinzenta) e o valor central (quadrado). A linha preta é a cotação e a linha verde é a média dos três métodos. Valores em USD por ação.', 'Each row shows the range of values for one method (grey bar) and the central value (square). The black line is the share price and the green line is the average of the three methods. Figures in USD per share.')}</p>
    <div class="ff">
      ${R.map(r => `<div class="ff-row"><div class="ff-l">${r[0]}<small>${r[1]}: ${nf(r[2], 0)} ${L('a', 'to')} ${nf(r[3], 0)}</small></div><div class="ff-t"><span class="ff-r" style="left:${px(r[2])}%;width:${(px(r[3]) - px(r[2])).toFixed(2)}%"></span><span class="ff-p" style="left:${px(r[4])}%" data-tip="${esc(r[0] + ': ' + usd(r[4]))}"></span></div><div class="ff-v">${nf(r[4], 2)}</div></div>`).join('')}
      <div class="ff-over">
        <i class="ff-line price" style="left:${px(v.price)}%"><b>${L('Cotação', 'Share price')}<br>${usd(v.price)}</b></i>
        <i class="ff-line avg" style="left:${px(v.avg)}%"><b>${L('Média', 'Average')}<br>${usd(v.avg)}</b></i>
      </div>
      <div class="ff-axis">${[50, 75, 100, 125, 150, 175, 200].map(t => `<span style="left:${px(t)}%">${t}</span>`).join('')}</div>
    </div>
  </section>

  <section class="sec">
    <div class="grid2">
      <div>
        <h2>${L('O que sustenta este valor', 'What supports this value')}</h2>
        <ul class="bul">
          <li>${L(`<b>Crescimento.</b> Receita a crescer ${pc(D.proj.growth[0], 0)} ao ano em 2026 e 2027 e ${pc(D.proj.growth[2], 0)} de 2028 a 2030, depois de ${pc(growth(h.rev, i25), 0)} em 2025.`, `<b>Growth.</b> Revenue growing ${pc(D.proj.growth[0], 0)} a year in 2026 and 2027 and ${pc(D.proj.growth[2], 0)} from 2028 to 2030, after ${pc(growth(h.rev, i25), 0)} in 2025.`)}</li>
          <li>${L(`<b>Margens.</b> A margem EBITDA sobe de ${pc(h.ebitda[i25] / h.rev[i25], 0)} em 2025 para ${pc(a.ebitda_margin_lt, 0)} em 2027, porque os custos crescem menos do que a receita.`, `<b>Margins.</b> The EBITDA margin rises from ${pc(h.ebitda[i25] / h.rev[i25], 0)} in 2025 to ${pc(a.ebitda_margin_lt, 0)} in 2027, as costs grow more slowly than revenue.`)}</li>
          <li>${L(`<b>Balanço e caixa.</b> Dívida líquida de apenas ${bn(D.co.net_debt)}, pouco investimento necessário e recompra de ações desde 2024.`, `<b>Balance sheet and cash.</b> Net debt of only ${bn(D.co.net_debt)}, low capital needs and share buybacks since 2024.`)}</li>

          <li>${L('<b>Regulação.</b> A passagem de condutores a trabalhadores por conta de outrem mudaria a estrutura de custos.', '<b>Regulation.</b> Reclassifying drivers as employees would change the cost structure.')}</li>
          <li>${L(`<b>Premissas.</b> Se a margem não duplicar como projeto, ou se o custo do capital for mais alto, o valor desce. Com um WACC de ${pc(last(d.sens_w), 2)} e um crescimento na perpetuidade de ${pc(d.sens_g[0], 0)}, o DCF dá ${usd(R[0][2])} e o EVA ${usd(R[1][2])}.`, `<b>Assumptions.</b> If margins do not double as I project, or if the cost of capital is higher, the value falls. With a WACC of ${pc(last(d.sens_w), 2)} and perpetual growth of ${pc(d.sens_g[0], 0)}, the DCF gives ${usd(R[0][2])} and EVA ${usd(R[1][2])}.`)}</li>
        </ul>
      </div>
    </div>
  </section>

  <section class="sec">
    <h2>${L('Como comparam os analistas', 'How analysts compare')}</h2>
    <p class="sub">${L(`Três preços-alvo publicados por bancos de investimento, apenas como referência. A média é ${usd(v.analysts_avg)}. Não entram na minha avaliação e alguns têm mais de um ano.`, `Three price targets published by investment banks, for reference only. The average is ${usd(v.analysts_avg)}. They are not part of my valuation and some are more than a year old.`)}</p>
    ${table([L('Banco', 'Bank'), L('Preço-alvo (USD)', 'Price target (USD)'), L('Data', 'Date'), L('Face à cotação', 'Vs share price')], v.analysts.map(x => [x.name, nf(x.pt, 2), fdate(x.date), sg(x.pt / v.price - 1, 0)]), { cls: 'compact' })}
  </section>

  <section class="sec">
    <h2>${L('Conclusão', 'Conclusion')}</h2>
    <div class="prose">${(state.lang === 'pt' ? CONCL.pt : CONCL.en).map(x => `<p>${x}</p>`).join('')}</div>
  </section>

  <p class="sign"><b>Rogério Teles</b><br>${L('3 de outubro de 2026. Demonstrações financeiras a 31/12/2025 e cotação de referência do fecho de 02/10/2026.', '3 October 2026. Financial statements as of 31/12/2025 and reference share price as of the close on 02/10/2026.')}</p>`;
}

    L('Uber Technologies, relatório do 2.º trimestre de 2026 (Form 10-Q): ações em circulação, dívida e dados do trimestre.', 'Uber Technologies, second quarter 2026 report (Form 10-Q): shares outstanding, debt and quarterly data.'),
    L(`Uber Technologies, ${a('https://www.sec.gov/Archives/edgar/data/1543151/000130817926000125/uber014597-def14a.htm', 'Proxy Statement de 2026 (DEF 14A)')}: conselho de administração, práticas de governance e estrutura acionista a 2 de março de 2026.`,
      `Uber Technologies, ${a('https://www.sec.gov/Archives/edgar/data/1543151/000130817926000125/uber014597-def14a.htm', '2026 Proxy Statement (DEF 14A)')}: board of directors, governance practices and ownership as of 2 March 2026.`),
    L(`Aswath Damodaran (NYU Stern), ${a('https://pages.stern.nyu.edu/~adamodar/New_Home_Page/data.html', 'dados de janeiro de 2026')}: crescimento esperado da receita por setor nos Estados Unidos.`,
      `Aswath Damodaran (NYU Stern), ${a('https://pages.stern.nyu.edu/~adamodar/New_Home_Page/data.html', 'January 2026 data')}: expected revenue growth by industry in the United States.`),
    L('Investing.com: gráfico mensal da cotação da Uber (consultado a 3 de outubro de 2026) e cotações diárias da Uber e do índice NYSE Composite, de 2021 a 2025, usadas no beta e no retorno do mercado.', 'Investing.com: monthly chart of Uber\u2019s share price (retrieved on 3 October 2026) and daily prices for Uber and the NYSE Composite index, 2021 to 2025, used for beta and the market return.'),
    L(`${a('https://www.tradingview.com/symbols/NYSE-UBER/bonds/', 'TradingView')}: obrigações da Uber, usadas no custo da dívida.`, `${a('https://www.tradingview.com/symbols/NYSE-UBER/bonds/', 'TradingView')}: Uber bonds, used for the cost of debt.`),
    L(`Yahoo Finance, estatísticas-chave: múltiplos de ${peerLinks(' e ')}.`, `Yahoo Finance, key statistics: multiples for ${peerLinks(' and ')}.`),
    L(`Preços-alvo de analistas: Morgan Stanley (${a('https://www.nasdaq.com/articles/new-analyst-forecast-uber-given-1150-price-target', 'Nasdaq')}), Citi (${a('https://www.gurufocus.com/news/8591812/uber-citigroup-lowers-price-target-to-110-maintains-buy-rating-uber-stock-news', 'GuruFocus')}) e JPMorgan (${a('https://www.investing.com/news/analyst-ratings/jpmorgan-raises-uber-stock-price-target-to-105-93CH-4054285', 'Investing.com')}).`,
      `Analyst price targets: Morgan Stanley (${a('https://www.nasdaq.com/articles/new-analyst-forecast-uber-given-1150-price-target', 'Nasdaq')}), Citi (${a('https://www.gurufocus.com/news/8591812/uber-citigroup-lowers-price-target-to-110-maintains-buy-rating-uber-stock-news', 'GuruFocus')}) and JPMorgan (${a('https://www.investing.com/news/analyst-ratings/jpmorgan-raises-uber-stock-price-target-to-105-93CH-4054285', 'Investing.com')}).`),
    L('Projeções, WACC, DCF, EVA e múltiplos: modelo próprio em Excel, de Rogério Teles.', 'Projections, WACC, DCF, EVA and multiples: own Excel model, by Rogério Teles.'),
  ];
  return `<div class="wrap">
    <h2>${L('Fontes', 'Sources')}</h2>
    <ol>${src.map(s => `<li>${s}</li>`).join('')}</ol>
  </div>`;
}

/* ====================== ARRANQUE ====================== */
const TABS = [
  ['empresa', 'Empresa', 'Company', viewEmpresa],
  ['gov', 'Governance e acionistas', 'Governance and shareholders', viewGov],
  ['perf', 'Desempenho', 'Performance', viewPerf],
  ['swot', 'SWOT e riscos', 'SWOT and risks', viewSwot],
  ['stmt', 'Demonstrações financeiras', 'Financial statements', viewStmt],
  ['dcf', 'DCF', 'DCF', viewDcf],
  ['eva', 'EVA', 'EVA', viewEva],
  ['mult', 'Múltiplos', 'Multiples', viewMult],
  ['fim', 'Conclusão', 'Conclusion', viewFim],
];
const $ = id => document.getElementById(id);

function render() {
  const v = D.val;
  document.documentElement.lang = state.lang === 'pt' ? 'pt-PT' : 'en';
  document.title = L('Uber Technologies: equity research e avaliação, por Rogério Teles', 'Uber Technologies: equity research and valuation, by Rogério Teles');
  $('brand-sub').textContent = L('Equity research e avaliação, por Rogério Teles', 'Equity research and valuation, by Rogério Teles');
  $('trip').innerHTML = `<div class="stop from"><i></i><div><small>${L('Cotação', 'Share price')}</small><b>${usd(v.price)}</b></div></div><span class="route"></span><div class="stop to"><i></i><div><small>${L('Valor estimado', 'Estimated value')}</small><b>${usd(v.avg)}</b></div></div><span class="up">${sg(v.up_avg, 0)}</span>`;
  $('trip').setAttribute('aria-label', L(`Cotação ${usd(v.price)}, valor estimado ${usd(v.avg)}`, `Share price ${usd(v.price)}, estimated value ${usd(v.avg)}`));
  $('notice').innerHTML = L('<b>AVISO:</b> Não constitui qualquer recomendação financeira, de investimento ou de negociação. Este dashboard destina-se exclusivamente a fins de estudo e não deve ser considerado como qualquer recomendação financeira. Como qualquer avaliação, é sensível às premissas utilizadas pelo autor.', '<b>NOTICE:</b> This does not constitute any financial, investment or trading recommendation. This dashboard is intended exclusively for study purposes and should not be regarded as any financial recommendation. Like any valuation, it is sensitive to the assumptions used by the author.');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  $('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t[0]}" data-tab="${t[0]}" aria-selected="${t[0] === state.tab}" tabindex="${t[0] === state.tab ? 0 : -1}">${L(t[1], t[2])}</button>`).join('');
  CH = []; cid = 0;
  $('view').innerHTML = TABS.find(t => t[0] === state.tab)[3]();
  $('view').setAttribute('aria-labelledby', 'tab-' + state.tab);
  $('foot').innerHTML = footerHtml();
  drawCharts();
  const act = document.querySelector('.tab[aria-selected="true"]');
  if (act && act.scrollIntoView) { const tb = $('tabs'); tb.scrollLeft = Math.max(0, act.offsetLeft - tb.clientWidth / 2 + act.clientWidth / 2); }
}

function go(tab) {
  state.tab = tab; render();
  const bar = document.querySelector('.tabsbar');
  if (bar.getBoundingClientRect().top <= 0) window.scrollTo({ top: bar.offsetTop, behavior: 'auto' });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab); return; }
  const l = e.target.closest('[data-lang]'); if (l) { state.lang = l.dataset.lang; save(); render(); return; }
  const s = e.target.closest('[data-stmt]'); if (s) { state.stmt = s.dataset.stmt; render(); }
});
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.findIndex(t => t[0] === state.tab), n = (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
  go(TABS[n][0]); const b = $('tab-' + TABS[n][0]); if (b) b.focus();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });
render();

</script>
</body>
</html>
